<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Phonics</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🧩 English Phonics</h1>
    <p>Learn English sounds in a simple way.</p>
</header>

<main class="container">

    <div class="content-box">

        <h2>🔊 Short Vowel Sounds</h2>

        <div class="letter-grid">

            <button class="letter" onclick="speak('apple')">
                A<br>
                🍎
            </button>

            <button class="letter" onclick="speak('egg')">
                E<br>
                🥚
            </button>

            <button class="letter" onclick="speak('igloo')">
                I<br>
                🏠
            </button>

            <button class="letter" onclick="speak('orange')">
                O<br>
                🍊
            </button>

            <button class="letter" onclick="speak('umbrella')">
                U<br>
                ☂️
            </button>

        </div>

    </div>

    <div class="content-box">

        <h2>📚 Simple Words</h2>

        <p style="font-size: 28px;">
            c + a + t = cat 🐱
        </p>

        <button class="open-button" onclick="speak('cat')">
            🔊 Listen
        </button>

    </div>

    <a href="english.html" class="back-button">
        ↩️ Back to English
    </a>

</main>

<script>
function speak(text) {

    if ("speechSynthesis" in window) {

        speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(text);

        speech.lang = "en-US";
        speech.rate = 0.75;

        speechSynthesis.speak(speech);
    }
}
</script>

</body>
</html>
