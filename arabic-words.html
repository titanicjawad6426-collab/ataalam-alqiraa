<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الكلمات العربية</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📝 الكلمات العربية</h1>
    <p>تعلم كلمات جديدة بطريقة ممتعة</p>
</header>

<main class="container">

    <div class="content-box">

        <h2>📚 كلمات سهلة</h2>

        <div class="letter-grid">

            <button class="letter" onclick="speakWord('أَسَد')">
                🦁<br>
                أَسَد
            </button>

            <button class="letter" onclick="speakWord('بَيْت')">
                🏠<br>
                بَيْت
            </button>

            <button class="letter" onclick="speakWord('كِتَاب')">
                📖<br>
                كِتَاب
            </button>

            <button class="letter" onclick="speakWord('شَمْس')">
                ☀️<br>
                شَمْس
            </button>

            <button class="letter" onclick="speakWord('قَلَم')">
                🖊️<br>
                قَلَم
            </button>

            <button class="letter" onclick="speakWord('سَمَكَة')">
                🐟<br>
                سَمَكَة
            </button>
            
            <button class="letter" onclick="speakWord('سَمَكَة')">
                🐟<br>
                سَمَكَة
            </button>

        </div>

    </div>

    <div class="content-box">

        <h2>🔊 استمع إلى الكلمة</h2>

        <p>
            اضغط على أي كلمة لسماع نطقها.
        </p>

        <p id="selected-word">
            اختر كلمة من الأعلى 👆
        </p>

    </div>

    <a href="arabic.html" class="back-button">
        ↩️ العودة إلى العربية
    </a>

</main>

<footer>
    <p>🌟 تعلم كلمة جديدة كل يوم 🌟</p>
</footer>

<script>
function speakWord(word) {

    const display = document.getElementById("selected-word");

    display.textContent = "🔊 " + word;

    if ("speechSynthesis" in window) {

        speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(word);

        speech.lang = "ar-SA";
        speech.rate = 0.75;
        speech.pitch = 1;

        speechSynthesis.speak(speech);

    } else {

        alert("الصوت غير مدعوم في هذا المتصفح.");

    }
}
</script>

</body>
</html>
