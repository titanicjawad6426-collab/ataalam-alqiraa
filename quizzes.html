<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المسابقات</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<header>
    <h1>🏆 المسابقات</h1>
    <p>اختبر معلوماتك واجمع النقاط ⭐</p>
</header>

<main class="container">

    <div class="section-grid">

        <div class="quiz-card">
            <h2>🔤 مسابقة الحروف</h2>
            <p>أسئلة حول الحروف.</p>
            <button class="open-button" onclick="showMessage('ستتم إضافة المسابقة قريباً')">
                ابدأ
            </button>
        </div>

        <div class="quiz-card">
            <h2>📝 مسابقة الكلمات</h2>
            <p>اختبر معرفتك بالكلمات.</p>
            <button class="open-button" onclick="showMessage('ستتم إضافة المسابقة قريباً')">
                ابدأ
            </button>
        </div>

        <div class="quiz-card">
            <h2>❓ أسئلة اختيار من متعدد</h2>
            <p>اختر الإجابة الصحيحة.</p>
            <button class="open-button" onclick="showMessage('ستتم إضافة المسابقة قريباً')">
                ابدأ
            </button>
        </div>

        <div class="quiz-card">
            <h2>⭐ النقاط والمستويات</h2>
            <p>اجمع النقاط وانتقل إلى مستويات جديدة.</p>
            <button class="open-button" onclick="showMessage('نظام النقاط سيضاف لاحقاً')">
                عرض
            </button>
        </div>

        <div class="quiz-card">
            <h2>🏅 النتائج</h2>
            <p>ستظهر نتائج الطفل هنا.</p>
            <button class="open-button" onclick="showMessage('صفحة النتائج ستضاف لاحقاً')">
                عرض
            </button>
        </div>

    </div>

    <a href="index.html" class="back-button">
        🏠 العودة إلى الرئيسية
    </a>

</main>

</body>
</html>
