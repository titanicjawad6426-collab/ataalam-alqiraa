<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعلم القراءة للأطفال</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e8f7ff, #fff8df);
      min-height: 100vh;
      text-align: center;
      color: #333;
    }

    header {
      background: #4a90e2;
      color: white;
      padding: 25px 15px;
      border-radius: 0 0 30px 30px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 16px;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      color: #4a90e2;
      margin-bottom: 10px;
    }

    .languages {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .language-btn {
      border: none;
      border-radius: 22px;
      padding: 25px 15px;
      font-size: 23px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .language-btn:active {
      transform: scale(0.96);
    }

    .arabic {
      background: #e85d75;
    }

    .french {
      background: #4a90e2;
    }

    .english {
      background: #58b368;
    }

    .emoji {
      display: block;
      font-size: 40px;
      margin-bottom: 8px;
    }

    footer {
      margin-top: 35px;
      padding: 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🌟 تعلم القراءة 🌟</h1>
    <p>تعلم الحروف بطريقة ممتعة وتفاعلية</p>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>مرحباً بك! 👋</h2>
      <p>اختر اللغة التي تريد أن تتعلم حروفها</p>
    </section>

    <section class="languages">

      <button class="language-btn arabic" onclick="openLanguage('العربية')">
        <span class="emoji">🇲🇦</span>
        حروف الهجاء
        <br>
        العربية
      </button>

      <button class="language-btn french" onclick="openLanguage('français')">
        <span class="emoji">🇫🇷</span>
        Lettres
        <br>
        Françaises
      </button>

      <button class="language-btn english" onclick="openLanguage('english')">
        <span class="emoji">🇬🇧</span>
        English
        <br>
        Letters
      </button>

    </section>

  </main>

  <footer>
    © 2026 تعلم القراءة للأطفال
  </footer>

  <script>
    function openLanguage(language) {
      alert("سنبدأ قريباً بتعلم حروف " + language + " 🎉");
    }
  </script>

</body>
</html>
