<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تعلم القراءة للأطفال</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e8f7ff, #fff8df);
      min-height: 100vh;
      text-align: center;
      color: #333;
    }

    header {
      background: #4a90e2;
      color: white;
      padding: 25px 15px;
      border-radius: 0 0 30px 30px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .languages {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .language-btn {
      border: none;
      border-radius: 22px;
      padding: 25px 15px;
      font-size: 23px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .arabic {
      background: #e85d75;
    }

    .french {
      background: #4a90e2;
    }

    .english {
      background: #58b368;
    }

    .emoji {
      display: block;
      font-size: 40px;
      margin-bottom: 8px;
    }

    .letters-page {
      display: none;
    }

    .letters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .letter {
      background: white;
      border: none;
      border-radius: 18px;
      padding: 18px 5px;
      font-size: 38px;
      font-weight: bold;
      color: #4a90e2;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      cursor: pointer;
    }

    .letter:active {
      transform: scale(0.92);
    }

    .back {
      margin-top: 25px;
      padding: 12px 25px;
      border: none;
      border-radius: 15px;
      background: #555;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 400px) {
      .letters {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🌟 تعلم القراءة 🌟</h1>
    <p>تعلم الحروف بطريقة ممتعة</p>
  </header>

  <!-- الصفحة الرئيسية -->

  <main class="container" id="homePage">

    <section class="welcome">
      <h2>مرحباً بك! 👋</h2>
      <p>اختر اللغة التي تريد أن تتعلم حروفها</p>
    </section>

    <section class="languages">

      <button class="language-btn arabic" onclick="showArabic()">
        <span class="emoji">🇲🇦</span>
        حروف الهجاء
        <br>
        العربية
      </button>

      <button class="language-btn french" onclick="comingSoon('الفرنسية')">
        <span class="emoji">🇫🇷</span>
        Lettres
        <br>
        Françaises
      </button>

      <button class="language-btn english" onclick="comingSoon('الإنجليزية')">
        <span class="emoji">🇬🇧</span>
        English
        <br>
        Letters
      </button>

    </section>

  </main>

  <!-- صفحة الحروف العربية -->

  <main class="container letters-page" id="arabicPage">

    <section class="welcome">
      <h2>🇲🇦 الحروف العربية</h2>
      <p>اضغط على أي حرف لسماع نطقه 🔊</p>
    </section>

    <section class="letters">

      <button class="letter" onclick="speak('ألف')">أ</button>
      <button class="letter" onclick="speak('باء')">ب</button>
      <button class="letter" onclick="speak('تاء')">ت</button>
      <button class="letter" onclick="speak('ثاء')">ث</button>

      <button class="letter" onclick="speak('جيم')">ج</button>
      <button class="letter" onclick="speak('حاء')">ح</button>
      <button class="letter" onclick="speak('خاء')">خ</button>
      <button class="letter" onclick="speak('دال')">د</button>

      <button class="letter" onclick="speak('ذال')">ذ</button>
      <button class="letter" onclick="speak('راء')">ر</button>
      <button class="letter" onclick="speak('زاي')">ز</button>
      <button class="letter" onclick="speak('سين')">س</button>

      <button class="letter" onclick="speak('شين')">ش</button>
      <button class="letter" onclick="speak('صاد')">ص</button>
      <button class="letter" onclick="speak('ضاد')">ض</button>
      <button class="letter" onclick="speak('طاء')">ط</button>

      <button class="letter" onclick="speak('ظاء')">ظ</button>
      <button class="letter" onclick="speak('عين')">ع</button>
      <button class="letter" onclick="speak('غين')">غ</button>
      <button class="letter" onclick="speak('فاء')">ف</button>

      <button class="letter" onclick="speak('قاف')">ق</button>
      <button class="letter" onclick="speak('كاف')">ك</button>
      <button class="letter" onclick="speak('لام')">ل</button>
      <button class="letter" onclick="speak('ميم')">م</button>

      <button class="letter" onclick="speak('نون')">ن</button>
      <button class="letter" onclick="speak('هاء')">ه</button>
      <button class="letter" onclick="speak('واو')">و</button>
      <button class="letter" onclick="speak('ياء')">ي</button>

    </section>

    <button class="back" onclick="goHome()">⬅️ العودة للرئيسية</button>

  </main>

  <footer>
    © 2026 تعلم القراءة للأطفال
  </footer>

  <script>

    function showArabic() {
      document.getElementById("homePage").style.display = "none";
      document.getElementById("arabicPage").style.display = "block";
    }

    function goHome() {
      document.getElementById("arabicPage").style.display = "none";
      document.getElementById("homePage").style.display = "block";
    }

    function speak(text) {

      if ("speechSynthesis" in window) {

        window.speechSynthesis.cancel();

        const voice = new SpeechSynthesisUtterance(text);

        voice.lang = "ar-SA";
        voice.rate = 0.7;
        voice.pitch = 1.1;

        window.speechSynthesis.speak(voice);

      } else {

        alert("عذراً، المتصفح لا يدعم النطق الصوتي.");

      }
    }

    function comingSoon(language) {
      alert("قسم " + language + " سيتم إضافته قريباً 🎉");
    }

  </script>

</body>
</html>
