</footer><script>
if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./sw.js")
            .then(() => {
                console.log("Service Worker registered");
            })
            .catch(error => {
                console.error(
                    "Service Worker error:",
                    error
                );
            });

    });

}
</script></body>
