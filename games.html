<main class="container">

    ====================== -->

    <div class="content-box">

                </span>

            </button>

                    Français
                </span>

            </button>

            </button>


        </div>

    </div>



    <!-- =====================
         قائمة الألعاب
    ====================== -->

    <div
        id="games-menu"
        class="content-box">


        <h2>
            🕹️ اختر لعبة
        </h2>


        <div class="app-grid">


            <button
                class="app-card"

                <span class="card-icon">
                    🔤
                </span>

                <span class="card-title">
                    اختيار الحرف
                </span>

            </button>


            <button
                class="app-card"

                <span class="card-icon">
                    🖼️
                </span>

                <span class="card-title">
                    مطابقة الكلمات
                </span>

            </button>


            <button
                class="app-card"
                onclick="startGame('order')">

                <span class="card-icon">
                    🔢
                </span>

                <span class="card-title">
                    ترتيب الحروف
                </span>

            </button>


            <button
                class="app-card"
                onclick="startGame('missing')">

                <span class="card-icon">
                    🧩
                </span>

                <span class="card-title">
                    الكلمة الناقصة
                </span>

            </button>


        </div>


    </div>



    <!-- =====================
         منطقة اللعبة
    ====================== -->

    <div
        id="game-area"
        class="content-box"
        style="display:none;">


        <div
            style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:10px;
            margin-bottom:20px;
            ">


            <strong>
                ⭐ النقاط:
                <span id="score">
                    0
                </span>
            </strong>


            <strong>
                السؤال:
                <span id="question-number">
                    1
                </span>
                /
                <span id="total">
                    5
                </span>
            </strong>


        </div>



        <div
            id="game-content"
            style="text-align:center;">


        </div>



        <p
            id="feedback"
            style="
            min-height:30px;
            font-size:20px;
            font-weight:bold;
            ">


        </p>



        <button
            id="next-button"
            class="open-button"
            onclick="nextQuestion()"
            style="display:none;">

            السؤال التالي ➡️

        </button>



        <br><br>


        <button
            class="back-button"
            onclick="showGamesMenu()">

            🎮 العودة إلى الألعاب

        </button>


    </div>



    <!-- =====================
         النتيجة
    ====================== -->

    <div
        id="result-area"
        class="content-box"
        style="display:none;text-align:center;">


        <div
            style="font-size:70px;">

            🏆

        </div>


        <h2>
            أحسنت!
        </h2>


        <p
            id="final-result"
            style="font-size:28px;">

        </p>


        <button
            class="open-button"
            onclick="restartGame()">

            🔄 العب مرة أخرى

        </button>


        <br><br>


        <button
            class="back-button"
            onclick="showGamesMenu()">

            🎮 ألعاب أخرى

        </button>


    </div>


    <br>


    <a
        href="index.html"
        class="back-button">

        🏠 العودة إلى الرئيسية

/* =========================
   اختيار اللغة
========================= */


function selectLanguage(selectedLanguage) {

    language = selectedLanguage;

    document.documentElement.lang = language;

    if (language === "ar") {

        document.documentElement.dir = "rtl";

    } else {

        document.documentElement.dir = "ltr";

    }

}



/* =========================
   بدء اللعبة
========================= */


function startGame(game) {

    currentGame = game;

    currentQuestion = 0;

    score = 0;

    answered = false;


    document.getElementById("games-menu")
        .style.display = "none";


    document.getElementById("game-area")
        .style.display = "block";


    document.getElementById("result-area")
        .style.display = "none";


    loadQuestion();

}



/* =========================
   تحميل السؤال
========================= */


function loadQuestion() {

    const questions =
        data[language][currentGame];


    const question =
        questions[currentQuestion];


    document.getElementById("score")
        .textContent = score;


    document.getElementById("question-number")
        .textContent = currentQuestion + 1;


    document.getElementById("total")
        .textContent = questions.length;


    document.getElementById("feedback")
        .textContent = "";


    document.getElementById("next-button")
        .style.display = "none";


    answered = false;


    const gameContent =
        document.getElementById("game-content");


    gameContent.innerHTML = "";


    const image =
        document.createElement("div");


    image.style.fontSize = "70px";

    image.style.marginBottom = "20px";

    image.textContent = question.image;


    gameContent.appendChild(image);



    const title =
        document.createElement("h2");


    title.textContent =
        question.question;


    gameContent.appendChild(title);



    const answers =
        document.createElement("div");


    answers.className =
        "app-grid";


    question.answers.forEach(function(answer) {


        const button =
            document.createElement("button");


        button.className =
            "app-card";


        button.style.aspectRatio =
            "1 / 1";


        button.innerHTML =
            '<span class="card-title">' +
            answer +
            '</span>';


        button.onclick =
            function() {

                checkAnswer(answer, button);

            };


        answers.appendChild(button);

    });


    gameContent.appendChild(answers);

}



/* =========================
   فحص الإجابة
========================= */


function checkAnswer(answer, button) {

    if (answered) {

        return;

    }


    answered = true;


    const question =
        data[language][currentGame][currentQuestion];


    if (answer === question.correct) {

        score++;


        button.style.borderColor =
            "#22c55e";


        button.style.background =
            "#dcfce7";


        document.getElementById("feedback")
            .textContent =
            "🎉 إجابة صحيحة! أحسنت!";


    } else {

        button.style.borderColor =
            "#ef4444";


        button.style.background =
            "#fee2e2";


        document.getElementById("feedback")
            .textContent =
            "💡 حاول مرة أخرى في السؤال التالي.";

    }


    document.getElementById("score")
        .textContent = score;


    document.getElementById("next-button")
        .style.display = "inline-block";

}



/* =========================
   السؤال التالي
========================= */


function nextQuestion() {

    currentQuestion++;


    const questions =
        data[language][currentGame];


    if (currentQuestion >= questions.length) {

        showResult();

    } else {

        loadQuestion();

    }

}



/* =========================
   عرض النتيجة
========================= */


function showResult() {

    document.getElementById("game-area")
        .style.display = "none";


    document.getElementById("result-area")
        .style.display = "block";


    const total =
        data[language][currentGame].length;


    document.getElementById("final-result")
        .textContent =
        "⭐ نتيجتك: " +
        score +
        " / " +
        total;

}



/* =========================
   إعادة اللعبة
========================= */


function restartGame() {

    currentQuestion = 0;

    score = 0;

    answered = false;


    document.getElementById("result-area")
        .style.display = "none";


    document.getElementById("game-area")
        .style.display = "block";


    loadQuestion();

}



/* =========================
   العودة لقائمة الألعاب
========================= */


function showGamesMenu() {

    document.getElementById("game-area")
        .style.display = "none";


    document.getElementById("result-area")
        .style.display = "none";


    document.getElementById("games-menu")
        .style.display = "block";

}
