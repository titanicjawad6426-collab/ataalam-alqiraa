<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الألعاب التعليمية</title>
<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f7ff;
    text-align:center;
}

header{
    padding:25px 10px;
    background:linear-gradient(135deg,#2196f3,#673ab7);
    color:white;
}

header h1{margin:0 0 10px}

.container{
    width:95%;
    max-width:850px;
    margin:20px auto;
}

.languages{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}

.languages button{
    border:0;
    padding:12px 20px;
    border-radius:12px;
    background:#fff;
    font-size:17px;
    cursor:pointer;
    box-shadow:0 2px 6px #ccc;
}

.languages button.active{
    background:#2196f3;
    color:white;
}

.games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
    gap:15px;
}

.game-card{
    background:white;
    padding:20px 10px;
    border-radius:18px;
    box-shadow:0 3px 10px #ddd;
    cursor:pointer;
    border:2px solid transparent;
    transition:.2s;
}

.game-card:active{transform:scale(.96)}

.game-card .icon{
    font-size:45px;
    display:block;
    margin-bottom:10px;
}

.game-card h3{
    font-size:17px;
    margin:8px 0;
    color:#333;
}

.game-card p{
    font-size:13px;
    color:#666;
}

.game-card.new{
    border-color:#4caf50;
}

.badge{
    background:#4caf50;
    color:white;
    padding:4px 9px;
    border-radius:20px;
    font-size:12px;
}

#game-area,#result-area{
    display:none;
    background:white;
    border-radius:18px;
    padding:20px 12px;
    margin-top:20px;
    box-shadow:0 3px 12px #ddd;
}

#question{
    font-size:28px;
    margin:25px 0;
    font-weight:bold;
}

.answers{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
    gap:12px;
    max-width:500px;
    margin:20px auto;
}

.answer-btn{
    background:#e3f2fd;
    border:2px solid #90caf9;
    border-radius:14px;
    padding:16px 8px;
    font-size:25px;
    cursor:pointer;
}

.answer-btn:disabled{
    opacity:.75;
    cursor:default;
}

.answer-btn.correct{
    background:#c8e6c9;
    border-color:#4caf50;
}

.answer-btn.wrong{
    background:#ffcdd2;
    border-color:#f44336;
}

.action-btn{
    border:0;
    border-radius:12px;
    padding:13px 22px;
    margin:8px;
    font-size:17px;
    background:#2196f3;
    color:white;
    cursor:pointer;
}

.back-btn{
    background:#607d8b;
}

#feedback{
    font-size:20px;
    font-weight:bold;
    min-height:35px;
    margin:15px;
}

.score-box{
    background:#e3f2fd;
    padding:12px;
    border-radius:12px;
    font-size:19px;
}

.section-title{
    margin:30px 0 15px;
    color:#333;
}

@media(max-width:400px){
    .game-card{padding:15px 5px}
    .game-card .icon{font-size:38px}
}
</style>
</head>

<body>

<header>
    <h1>🎮 الألعاب التعليمية</h1>
    <p>تعلم والعب واجمع النقاط ⭐</p>
</header>

<main class="container">

    <h2>🌍 اختر اللغة</h2>

    <div class="languages">
