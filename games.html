<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الألعاب التعليمية</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<header>
    <h1>🎮 الألعاب التعليمية</h1>
    <p>تعلم والعب في نفس الوقت!</p>
</header>

<main class="container">

    <div class="section-grid">

        <div class="game-card">
            <h2>🔤 لعبة الحروف</h2>
            <p>تعرف على الحرف الصحيح.</p>
            <button class="open-button" onclick="showMessage('سيتم إضافة لعبة الحروف قريباً')">
                لعب
            </button>
        </div>

        <div class="game-card">
            <h2>📝 لعبة الكلمات</h2>
            <p>تعلم الكلمات بطريقة ممتعة.</p>
            <button class="open-button" onclick="showMessage('سيتم إضافة لعبة الكلمات قريباً')">
                لعب
            </button>
        </div>

        <div class="game-card">
            <h2>🖼️ لعبة الصور</h2>
            <p>اربط الصورة بالكلمة المناسبة.</p>
            <button class="open-button" onclick="showMessage('سيتم إضافة لعبة الصور قريباً')">
                لعب
            </button>
        </div>

        <div class="game-card">
            <h2>🔊 لعبة الاستماع</h2>
            <p>استمع واختر الإجابة الصحيحة.</p>
            <button class="open-button" onclick="showMessage('سيتم إضافة لعبة الاستماع قريباً')">
                لعب
            </button>
        </div>

        <div class="game-card">
            <h2>🔗 لعبة المطابقة</h2>
            <p>طابق الحروف والكلمات والصور.</p>
            <button class="open-button" onclick="showMessage('سيتم إضافة لعبة المطابقة قريباً')">
                لعب
            </button>
        </div>

    </div>

    <a href="index.html" class="back-button">
        🏠 العودة إلى الرئيسية
    </a>

</main>

</body>
</html>
