<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>تعلم الضرب</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            background: #f4f7fb;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            color: #171717;
        }


        /* =====================================
           العنوان
        ===================================== */

        .header {
            width: 100%;

            padding: 28px 15px 24px;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #3f51b5,
                    #03a9f4
                );

            color: white;

            border-radius:
                0 0 35px 35px;
        }

        .header h1 {
            margin: 0;

            font-size:
                clamp(30px, 8vw, 46px);

            font-weight: 800;
        }

        .header p {
            margin: 12px 0 0;

            font-size:
                clamp(20px, 5vw, 28px);
        }


        /* =====================================
           رقم العملية
        ===================================== */

        .progress {
            margin-top: 25px;

            text-align: center;

            font-size:
                clamp(19px, 5vw, 26px);

            color: #333;
        }


        /* =====================================
           منطقة التمرين
        ===================================== */

        .exercise {
            width: 100%;

            margin-top: 42px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        /* =====================================
           لوحة العملية
           
           6 أعمدة ثابتة
           جميع الصفوف تستخدم نفس الأعمدة
           ===================================== */

        .operation-board {

            --cell-size:
                clamp(42px, 11vw, 58px);

            display: grid;

            grid-template-columns:
                repeat(6, var(--cell-size));

            grid-auto-rows:
                var(--cell-size);

            justify-content: center;

            direction: ltr;

            width: max-content;

            margin: 0 auto;
        }


        /* =====================================
           صف الأرقام
        ===================================== */

        .number-row {

            display: grid;

            grid-template-columns:
                repeat(6, var(--cell-size));

            grid-column:
                1 / 7;

            height:
                var(--cell-size);

            align-items: center;
        }


        .digit {

            width:
                var(--cell-size);

            height:
                var(--cell-size);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size:
                clamp(38px, 9vw, 52px);

            font-weight: 900;

            line-height: 1;

            color: #111;
        }


        /* =====================================
           علامة الضرب
        ===================================== */

        .multiply-symbol {

            width:
                var(--cell-size);

            height:
                var(--cell-size);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size:
                clamp(32px, 8vw, 44px);

            font-weight: 900;

            color: #111;
        }


        /* =====================================
           الخط الفاصل

           يتم تحديد طوله من JavaScript
           حسب عدد أرقام النتيجة
        ===================================== */

        .separator {

            height: 5px;

            background: #202020;

            border-radius: 5px;

            align-self: center;

            grid-column:
                var(--line-start)
                /
                span var(--answer-length);

            width: 100%;

            margin: 0;

        }


        /* =====================================
           صف النتيجة
        ===================================== */

        .answer-row {

            display: grid;

            grid-template-columns:
                repeat(6, var(--cell-size));

            grid-column:
                1 / 7;

            height:
                var(--cell-size);

            align-items: center;

            margin-top: 8px;
        }


        .answer-cell {

            width:
                var(--cell-size);

            height:
                var(--cell-size);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size:
                clamp(38px, 9vw, 52px);

            font-weight: 900;

            color: #111;
        }


        /* =====================================
           النقاط
        ===================================== */

        .answer-dot {

            font-size:
                clamp(28px, 7vw, 38px);

            color: #777;

            font-weight: 700;
        }


        /* =====================================
           خانة الإدخال
        ===================================== */

        .answer-input {

            width:
                calc(
                    var(--cell-size) - 8px
                );

            height:
                calc(
                    var(--cell-size) - 6px
                );

            padding: 0;

            margin: 0;

            border:
                4px solid #08a77b;

            border-radius: 12px;

            background: white;

            text-align: center;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            font-size:
                clamp(32px, 8vw, 46px);

            font-weight: 900;

            color: #111;

            outline: none;

            direction: ltr;

            box-shadow:
                0 0 0 5px
                rgba(
                    8,
                    167,
                    123,
                    0.14
                );
        }


        .answer-input:focus {

            border-color: #087f63;

            box-shadow:
                0 0 0 5px
                rgba(
                    8,
                    167,
                    123,
                    0.20
                );
        }


        /* =====================================
           زر التحقق
        ===================================== */

        .check-button {

            margin-top: 45px;

            width:
                min(88vw, 360px);

            min-height: 68px;

            border: none;

            border-radius: 24px;

            background:
                #1688ff;

            color: white;

            font-size:
                clamp(25px, 7vw, 32px);

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 5px 12px
                rgba(
                    0,
                    0,
                    0,
                    0.15
                );
        }


        .check-button:active {

            transform:
                scale(0.97);
        }


        .check-button:disabled {

            opacity: 0.6;

            cursor: default;
        }


        /* =====================================
           الرسالة
        ===================================== */

        .message {

            min-height: 45px;

            margin-top: 20px;

            text-align: center;

            font-size:
                clamp(21px, 5vw, 27px);

            font-weight: 800;
        }


        .correct {
            color: #00a878;
        }


        .wrong {
            color: #e53935;
        }


        /* =====================================
           الهاتف
        ===================================== */

        @media (max-width: 500px) {

            .exercise {

                margin-top: 32px;
            }


            .separator {

                height: 4px;
            }


            .check-button {

                margin-top: 38px;
            }

        }

    </style>
</head>


<body>


    <!-- =====================================
         العنوان
    ====================================== -->

    <header class="header">

        <h1>
            ✖ تعلم الضرب
        </h1>

        <p>
            المستوى
            <span id="levelNumber">1</span>
        </p>

    </header>


    <!-- =====================================
         رقم العملية
    ====================================== -->

    <div class="progress">

        العملية
        <span id="questionNumber">1</span>
        من
        12

    </div>


    <!-- =====================================
         التمرين
    ====================================== -->

    <main class="exercise">


        <div
            id="operationBoard"
            class="operation-board"
        >


            <!-- العدد الأول -->

            <div
                id="numberARow"
                class="number-row"
            ></div>


            <!-- العدد الثاني -->

            <div
                id="numberBRow"
                class="number-row"
            ></div>


            <!-- الخط الفاصل -->

            <div
                id="separator"
                class="separator"
            ></div>


            <!-- النتيجة -->

            <div
                id="answerRow"
                class="answer-row"
            ></div>


        </div>


        <!-- زر التحقق -->

        <button
            id="checkAnswer"
            class="check-button"
            type="button"
        >
            ✓ تحقق
        </button>


        <!-- الرسالة -->

        <div
            id="message"
            class="message"
        ></div>


    </main>


    <script src="multiplication.js?v=22"></script>

</body>

    </html>
