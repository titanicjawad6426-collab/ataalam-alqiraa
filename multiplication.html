<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>تعلم الضرب</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            background: #f4f7fb;

            font-family:
                Arial,
                "Tahoma",
                sans-serif;

            color: #202124;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            padding: 28px 15px 22px;

            text-align: center;

            background: linear-gradient(
                135deg,
                #3f51b5,
                #03a9f4
            );

            color: white;

            border-radius: 0 0 35px 35px;
        }

        .header h1 {
            margin: 0;

            font-size: clamp(
                30px,
                8vw,
                46px
            );

            font-weight: 800;
        }

        .header p {
            margin: 12px 0 0;

            font-size: clamp(
                20px,
                5vw,
                28px
            );
        }

        .progress {
            margin-top: 25px;

            font-size: clamp(
                18px,
                5vw,
                25px
            );

            color: #333;
        }

        /* =================================
           منطقة العملية
        ================================= */

        .exercise {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            margin-top: 45px;
        }

        /*
           شبكة ثابتة حتى تبقى الأرقام
           فوق بعضها بشكل دقيق.
        */

        .operation-board {
            direction: ltr;

            display: flex;
            flex-direction: column;
            align-items: center;

            width: max-content;

            margin: 0 auto;
        }

        .number-row {
            display: grid;

            grid-template-columns:
                repeat(6, 48px);

            align-items: center;

            min-height: 62px;
        }

        .digit {
            width: 48px;

            text-align: center;

            font-size: 42px;

            font-weight: 800;

            line-height: 1;

            color: #151515;
        }

        .multiply-symbol {
            width: 48px;

            text-align: center;

            font-size: 38px;

            font-weight: 800;

            color: #151515;
        }

        /*
           الصف الأول والثاني:
           الأرقام تكون بمحاذاة اليمين
           مثل الكتابة المدرسية.
        */

        .top-number {
            grid-column:
                4 / 7;
        }

        .bottom-number {
            grid-column:
                4 / 7;
        }

        .multiplier-symbol {
            grid-column: 3;
        }

        /* =================================
           الخط الفاصل
        ================================= */

        .separator {
            width: 270px;

            height: 5px;

            background: #222;

            border-radius: 5px;

            margin:
                12px auto
                18px;
        }

        /* =================================
           منطقة الإجابة
        ================================= */

        .answer-row {
            direction: ltr;

            display: grid;

            grid-template-columns:
                repeat(6, 48px);

            align-items: center;

            min-height: 64px;

            margin-bottom: 20px;
        }

        .answer-digit {
            width: 48px;
            height: 56px;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 42px;

            font-weight: 800;

            color: #151515;
        }

        /*
           خانة الكتابة الحالية
        */

        .answer-input {
            width: 42px;
            height: 54px;

            padding: 0;

            border:
                3px solid #287cff;

            border-radius: 8px;

            background: white;

            text-align: center;

            font-size: 36px;

            font-weight: 800;

            color: #111;

            outline: none;

            direction: ltr;
        }

        .answer-input:focus {
            border-color: #00a878;

            box-shadow:
                0 0 0 4px
                rgba(0, 168, 120, 0.15);
        }

        /*
           النقطة التي تعني أن هناك
           خانة لم تتم كتابتها بعد
        */

        .answer-dot {
            width: 48px;

            text-align: center;

            font-size: 34px;

            font-weight: 700;

            color: #777;
        }

        /* =================================
           زر التحقق
        ================================= */

        .check-button {
            margin-top: 35px;

            width: min(
                88vw,
                360px
            );

            min-height: 68px;

            border: none;

            border-radius: 22px;

            background: #1688ff;

            color: white;

            font-size: 28px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 5px 12px
                rgba(0, 0, 0, 0.15);
        }

        .check-button:active {
            transform: scale(0.97);
        }

        /* =================================
           رسالة النتيجة
        ================================= */

        .message {
            min-height: 45px;

            margin-top: 20px;

            text-align: center;

            font-size: 24px;

            font-weight: 700;
        }

        .correct {
            color: #00a878;
        }

        .wrong {
            color: #e53935;
        }

        /* =================================
           الهاتف
        ================================= */

        @media (max-width: 500px) {

            .number-row,
            .answer-row {
                grid-template-columns:
                    repeat(6, 40px);
            }

            .digit,
            .multiply-symbol,
            .answer-digit,
            .answer-dot {
                width: 40px;
            }

            .digit {
                font-size: 38px;
            }

            .multiply-symbol {
                font-size: 34px;
            }

            .answer-digit {
                font-size: 38px;
            }

            .answer-dot {
                font-size: 30px;
            }

            .answer-input {
                width: 36px;
                height: 50px;

                font-size: 32px;
            }

            .separator {
                width: 230px;

                height: 4px;
            }

            .exercise {
                margin-top: 35px;
            }

            .check-button {
                margin-top: 28px;
            }
        }
    </style>
</head>


<body>

    <header class="header">

        <h1>✖ تعلم الضرب</h1>

        <p>
            المستوى
            <span id="levelNumber">1</span>
        </p>

    </header>


    <div class="progress">

        العملية
        <span id="questionNumber">1</span>
        من
        12

    </div>


    <main class="exercise">

        <div class="operation-board">

            <!-- العدد الأول -->

            <div
                id="numberARow"
                class="number-row"
            >
                <span
                    id="numberA"
                    class="digit top-number"
                >
                    2
                </span>
            </div>


            <!-- العدد الثاني -->

            <div
                id="numberBRow"
                class="number-row"
            >

                <span
                    class="multiply-symbol multiplier-symbol"
                >
                    ×
                </span>

                <span
                    id="numberB"
                    class="digit bottom-number"
                >
                    5
                </span>

            </div>


            <!-- الخط -->

            <div class="separator"></div>


            <!-- الإجابة -->

            <div
                id="answerRow"
                class="answer-row"
            >
            </div>

        </div>


        <button
            id="checkAnswer"
            class="check-button"
            type="button"
        >
            ✓ تحقق
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </main>


    <script src="multiplication.js?v=21"></script>

</body>

</html>
