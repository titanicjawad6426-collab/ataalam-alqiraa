<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رتب الحروف</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f8ff;
    text-align: center;
    color: #333;
}

header {
    background: #2196f3;
    color: white;
    padding: 18px;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

.container {
    max-width: 550px;
    margin: 20px auto;
    padding: 15px;
}

.info {
    display: flex;
    justify-content: space-around;
    background: white;
    padding: 12px;
    border-radius: 15px;
    font-size: 18px;
    font-weight: bold;
}

.picture {
    font-size: 100px;
    margin: 20px 0;
    background: white;
    border-radius: 20px;
    padding: 20px;
}

h2 {
    color: #1976d2;
}

.answer {
    min-height: 75px;
    background: #fff;
    border: 3px dashed #4caf50;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    padding: 10px;
    flex-wrap: wrap;
    margin: 20px 0;
}

.letters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}

.letter {
    width: 55px;
    height: 58px;
    border: none;
    border-radius: 12px;
    background: #ffca28;
    font-size: 27px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 5px #bbb;
}

.letter:disabled {
    opacity: 0.2;
    cursor: default;
}

.answer .letter {
    background: #81c784;
    box-shadow: none;
}

button.action {
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    margin: 6px;
    font-size: 18px;
    cursor: pointer;
    color: white;
}

.check {
    background: #2196f3;
}

.clear {
    background: #ff9800;
}

.next {
    background: #4caf50;
}

.message {
    font-size: 21px;
    font-weight: bold;
    min-height: 35px;
    margin: 15px;
}

.result {
    display: none;
    background: white;
    border-radius: 20px;
    padding: 25px;
    margin-top: 20px;
}

.home {
    display: inline-block;
    margin: 20px;
    padding: 12px 25px;
    background: #607d8b;
    color: white;
    text-decoration: none;
    border-radius: 12px;
}
</style>
</head>

<body>

<header>
    <h1>🔤 رتّب الحروف</h1>
    <p>شاهد الصورة وركّب الكلمة الصحيحة</p>
</header>

<div class="container">

    <div class="info">
        <span id="questionNumber">السؤال 1 / 10</span>
        <span>⭐ <span id="score">0</span></span>
    </div>

    <div id="game">

        <div class="picture" id="picture">🐱</div>

        <h2>ما اسم هذه الصورة؟</h2>

        <div class="answer" id="answer"></div>

        <h3>اختر الحروف بالترتيب الصحيح:</h3>

        <div class="letters" id="letters"></div>

        <div class="message" id="message"></div>

        <button class="action clear" onclick="clearAnswer()">
            ↩ مسح
        </button>

        <button class="action check" onclick="checkAnswer()">
            ✓ تحقق
        </button>

        <button class="action next" id="nextButton"
                onclick="nextQuestion()" style="display:none">
            السؤال التالي ←
        </button>

    </div>

    <div class="result" id="result">
        <h1>🎉 أحسنت!</h1>
        <h2>لقد أكملت اللعبة</h2>
        <p id="finalScore"></p>
        <button class="action next" onclick="restartGame()">
            🔄 العب من جديد
        </button>
    </div>

</div>

<a href="arabic-words.html" class="home">
    🏠 العودة إلى الكلمات
</a>

<script>
const words = [
    { word: "أسد", image: "🦁" },
    { word: "قمر", image: "🌙" },
    { word: "تفاح", image: "🍎" },
    { word: "سمكة", image: "🐟" },
    { word: "قطة", image: "🐱" },
    { word: "موز", image: "🍌" },
    { word: "باب", image: "🚪" },
    { word: "كتاب", image: "📚" },
    { word: "شمس", image: "☀️" },
    { word: "حصان", image: "🐎" },
    { word: "كلب", image: "🐶" },
    { word: "زهرة", image: "🌷" },
    { word: "نحلة", image: "🐝" },
    { word: "سيارة", image: "🚗" },
    { word: "بيت", image: "🏠" }
];

let questions = [];
let current = 0;
let score = 0;
let selected = [];
let answered = false;

function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}

function startGame() {
    questions = shuffle(words).slice(0, 10);
    current = 0;
    score = 0;

    document.getElementById("game").style.display = "block";
    document.getElementById("result").style.display = "none";

    showQuestion();
}

function showQuestion() {
    selected = [];
    answered = false;

    const item = questions[current];

    document.getElementById("picture").textContent = item.image;
    document.getElementById("questionNumber").textContent =
        "السؤال " + (current + 1) + " / 10";

    document.getElementById("score").textContent = score;
    document.getElementById("message").textContent = "";
    document.getElementById("answer").innerHTML = "";
    document.getElementById("nextButton").style.display = "none";

    let letters = item.word.split("");

    // خلط الحروف مع التأكد من اختلاف ترتيبها الأصلي
    let mixed = shuffle(letters);

    if (letters.length > 1 &&
        mixed.join("") === item.word) {
        mixed = [...mixed.slice(1), mixed[0]];
    }

    const lettersBox = document.getElementById("letters");
    lettersBox.innerHTML = "";

    mixed.forEach((letter, index) => {
        const button = document.createElement("button");
        button.className = "letter";
        button.textContent = letter;

        button.onclick = () => selectLetter(letter, index, button);

        lettersBox.appendChild(button);
    });
}

function selectLetter(letter, index, button) {
    if (answered || button.disabled) return;

    selected.push({
        letter: letter,
        index: index
    });

    button.disabled = true;

    const answerBox = document.getElementById("answer");

    const answerButton = document.createElement("button");
    answerButton.className = "letter";
    answerButton.textContent = letter;

    answerButton.onclick = () => {
        if (answered) return;

        const position = selected.findIndex(
            item => item.index === index
        );

        if (position !== -1) {
            selected.splice(position, 1);
            button.disabled = false;
            answerButton.remove();
        }
    };

    answerBox.appendChild(answerButton);
}

function clearAnswer() {
    if (answered) return;

    selected = [];

    document.querySelectorAll("#letters .letter").forEach(button => {
        button.disabled = false;
    });

    document.getElementById("answer").innerHTML = "";
    document.getElementById("message").textContent = "";
}

function checkAnswer() {
    if (answered) return;

    if (selected.length !== questions[current].word.length) {
        document.getElementById("message").textContent =
            "اختر جميع الحروف أولاً 🙂";
        return;
    }

    const answer = selected.map(item => item.letter).join("");
    const correct = questions[current].word;

    if (answer === correct) {
        score++;
        document.getElementById("score").textContent = score;

        document.getElementById("message").textContent =
            "⭐ ممتاز! إجابة صحيحة";
        document.getElementById("message").style.color = "green";
    } else {
        document.getElementById("message").textContent =
            "❌ حاول مرة أخرى!";
        document.getElementById("message").style.color = "red";
        return;
    }

    answered = true;

    document.getElementById("nextButton").style.display = "inline-block";

    document.querySelectorAll("#letters .letter").forEach(button => {
        button.disabled = true;
    });
}

function nextQuestion() {
    current++;

    if (current >= 10) {
        finishGame();
    } else {
        showQuestion();
    }
}

function finishGame() {
    document.getElementById("game").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("finalScore").textContent =
        "نتيجتك: " + score + " من 10 ⭐";
}

function restartGame() {
    startGame();
}

startGame();
</script>

</body>
</html>
