<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تعلم الطرح</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            background: #f4f7fb;

            color: #111;

            text-align: center;

        }


        /* ===============================
           الرأس
        =============================== */

        .page-header {

            background:
                linear-gradient(
                    135deg,
                    #2196f3,
                    #00bcd4
                );

            color: white;

            padding:
                28px 15px;

            border-radius:
                0 0 35px 35px;

        }

        .page-header h1 {

            margin: 0;

            font-size: 34px;

            font-weight: 800;

        }

        .page-header p {

            margin:
                12px 0 0;

            font-size: 22px;

        }


        /* ===============================
           معلومات العملية
        =============================== */

        .question-info {

            margin-top: 28px;

            font-size: 21px;

        }


        /* ===============================
           لوحة العملية
        =============================== */

        .operation-wrapper {

            width: 100%;

            display: flex;

            justify-content: center;

            margin-top: 40px;

        }


        .operation-board {

            /*
               ستة أعمدة ثابتة
               لضمان المحاذاة
            */

            --cell:
                clamp(
                    42px,
                    10vw,
                    58px
                );

            --gap: 2px;

            display: grid;

            grid-template-columns:
                repeat(
                    6,
                    var(--cell)
                );

            grid-auto-rows:
                var(--cell);

            column-gap:
                var(--gap);

            row-gap: 5px;

            direction: ltr;

            justify-content: center;

            width: max-content;

        }


        /* ===============================
           أرقام العملية
        =============================== */

        .number-row {

            display: contents;

        }


        .digit {

            width: var(--cell);

            height: var(--cell);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size:
                clamp(
                    34px,
                    9vw,
                    52px
                );

            font-weight: 800;

            line-height: 1;

        }


        .subtract-symbol {

            width: var(--cell);

            height: var(--cell);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size:
                clamp(
                    30px,
                    8vw,
                    46px
                );

            font-weight: 800;

        }


        /* ===============================
           الخط الفاصل
        =============================== */

        .separator {

            height: 6px;

            min-height: 6px;

            background: #222;

            border-radius: 5px;

            align-self: center;

            width: 100%;

        }


        /* ===============================
           النتيجة
        =============================== */

        .answer-cell {

            width: var(--cell);

            height: var(--cell);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size:
                clamp(
                    34px,
                    9vw,
                    52px
                );

            font-weight: 800;

            line-height: 1;

        }


        .answer-dot {

            color: #777;

            font-size: 34px;

        }


        /* ===============================
           مربع إدخال الرقم
        =============================== */

        .answer-input {

            width:
                calc(
                    var(--cell) - 8px
                );

            height:
                calc(
                    var(--cell) - 8px
                );

            border:

                4px solid

                #16b89a;

            border-radius: 14px;

            background: white;

            text-align: center;

            font-size:
                clamp(
                    30px,
                    8vw,
                    46px
                );

            font-weight: 800;

            outline: none;

            padding: 0;

            box-shadow:
                0 0 0 5px
                rgba(
                    22,
                    184,
                    154,
                    .15
                );

        }


        .answer-input:focus {

            border-color:
                #008f7a;

        }


        /* ===============================
           الرسائل
        =============================== */

        .message {

            min-height: 70px;

            margin:
                28px auto 10px;

            width:
                min(
                    92%,
                    600px
                );

            font-size: 22px;

            font-weight: bold;

            line-height: 1.7;

        }


        .message.correct {

            color: #079669;

        }


        .message.wrong {

            color: #d63031;

        }


        /* ===============================
           زر تحقق
        =============================== */

        .check-button {

            width:
                min(
                    90%,
                    600px
                );

            min-height: 70px;

            border: none;

            border-radius: 25px;

            background:
                #2196f3;

            color: white;

            font-size: 28px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 6px 15px
                rgba(
                    0,
                    0,
                    0,
                    .15
                );

        }


        .check-button:active {

            transform:
                scale(.98);

        }


        .check-button:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        /* ===============================
           زر العودة
        =============================== */

        .back-button {

            display: inline-block;

            margin:
                20px auto 35px;

            padding:
                13px 25px;

            border-radius: 18px;

            background: #555;

            color: white;

            text-decoration: none;

            font-size: 18px;

        }


        /* ===============================
           الهاتف
        =============================== */

        @media (
            max-width: 500px
        ) {

            .page-header h1 {

                font-size: 30px;

            }

            .page-header p {

                font-size: 20px;

            }

            .operation-wrapper {

                margin-top: 30px;

            }

            .message {

                font-size: 20px;

            }

            .check-button {

                min-height: 65px;

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


    <header class="page-header">

        <h1>
            ➖ تعلم الطرح
        </h1>

        <p>
            المستوى
            <span id="levelNumber">
                1
            </span>
        </p>

    </header>


    <div class="question-info">

        العملية

        <span id="questionNumber">
            1
        </span>

        من 12

    </div>


    <main>

        <div class="operation-wrapper">

            <div
                id="operationBoard"
                class="operation-board"
            >

                <!-- العدد الأول -->
                <div
                    id="numberARow"
                    class="number-row"
                ></div>


                <!-- العدد الثاني -->
                <div
                    id="numberBRow"
                    class="number-row"
                ></div>


                <!-- الخط -->
                <div
                    id="separator"
                    class="separator"
                ></div>


                <!-- النتيجة -->
                <div
                    id="answerRow"
                    class="number-row"
                ></div>

            </div>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <button
            id="checkAnswer"
            class="check-button"
        >
            ✓ تحقق
        </button>


        <br>


        <a
            href="subtraction-levels.html"
            class="back-button"
        >
            ↩ مستويات الطرح
        </a>

    </main>


    <script
        src="subtraction.js?v=1"
    ></script>

</body>

</html>
