<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستماع والنطق</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🔊 الاستماع والنطق</h1>
    <p>استمع وتعلم النطق الصحيح</p>
</header>

<main class="container">

    <div class="content-box">

        <h2>🔤 الحروف</h2>

        <div class="letter-grid">

            <button class="letter" onclick="speak('أ')">🔊 أ</button>
            <button class="letter" onclick="speak('ب')">🔊 ب</button>
            <button class="letter" onclick="speak('ت')">🔊 ت</button>
            <button class="letter" onclick="speak('ث')">🔊 ث</button>
            <button class="letter" onclick="speak('ج')">🔊 ج</button>
            <button class="letter" onclick="speak('ح')">🔊 ح</button>
            <button class="letter" onclick="speak('خ')">🔊 خ</button>
            <button class="letter" onclick="speak('د')">🔊 د</button>

        </div>

    </div>

    <div class="content-box">

        <h2>📝 كلمات</h2>

        <div class="letter-grid">

            <button class="letter" onclick="speak('أسد')">🦁 أسد</button>
            <button class="letter" onclick="speak('بيت')">🏠 بيت</button>
            <button class="letter" onclick="speak('كتاب')">📖 كتاب</button>
            <button class="letter" onclick="speak('قلم')">🖊️ قلم</button>

        </div>

    </div>

    <a href="arabic.html" class="back-button">
        ↩️ العودة إلى العربية
    </a>

</main>

<script>
function speak(text) {

    if ("speechSynthesis" in window) {

        speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(text);

        speech.lang = "ar-SA";
        speech.rate = 0.75;

        speechSynthesis.speak(speech);

    }
}
</script>

</body>
</html>
