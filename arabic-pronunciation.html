<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستماع والنطق</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🔊 الاستماع والنطق</h1>
    <p>استمع وتعلم النطق الصحيح</p>
</header>

<main class="container">

    <div class="content-box">

        <h2>🔤 الحروف</h2>

        <div class="letter-grid">

            <button class="letter" onclick="playLetter('أ', 'ألف')">🔊 أ</button>
            <button class="letter" onclick="playLetter('ب', 'باء')">🔊 ب</button>
            <button class="letter" onclick="playLetter('ت', 'تاء')">🔊 ت</button>
            <button class="letter" onclick="playLetter('ث', 'ثاء')">🔊 ث</button>
            <button class="letter" onclick="playLetter('ج', 'جيم')">🔊 ج</button>
            <button class="letter" onclick="playLetter('ح', 'حاء')">🔊 ح</button>
            <button class="letter" onclick="playLetter('خ', 'خاء')">🔊 خ</button>
            <button class="letter" onclick="playLetter('د', 'دال')">🔊 د</button>

        </div>

    </div>


    <div class="content-box">

        <h2>📝 كلمات</h2>

        <div class="letter-grid">

            <button class="letter" onclick="speak('أسد')">🦁 أسد</button>
            <button class="letter" onclick="speak('بيت')">🏠 بيت</button>
            <button class="letter" onclick="speak('كتاب')">📖 كتاب</button>
            <button class="letter" onclick="speak('قلم')">🖊️ قلم</button>

        </div>

    </div>


    <a href="arabic.html" class="back-button">
        ↩️ العودة إلى العربية
    </a>

</main>


<script>

/* تشغيل صوت الحرف من مجلد audio */

function playLetter(letter, audioName) {

    try {

        const audio = new Audio(
            "audio/" + encodeURIComponent(audioName) + ".mp3"
        );

        audio.play().catch(function(error) {

            console.log("تعذر تشغيل الملف الصوتي:", error);

            // إذا تعذر تشغيل MP3، نستعمل النطق الآلي كبديل
            speak(letter);

        });

    } catch (error) {

        console.log("خطأ في تشغيل الصوت:", error);

        speak(letter);
    }
}


/* نطق الكلمات */

function speak(text) {

    if ("speechSynthesis" in window) {

        speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(text);

        speech.lang = "ar-SA";
        speech.rate = 0.75;

        speechSynthesis.speak(speech);

    }

}

</script>

</body>
</html>
