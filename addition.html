<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تعلم الجمع</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .addition-page {
            max-width: 850px;
            margin: auto;
            padding: 15px;
        }

        .addition-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .addition-title h2 {
            font-size: 30px;
        }

        .levels {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .level-btn {
            border: none;
            border-radius: 15px;
            padding: 12px 5px;
            background: #eeeeee;
            cursor: pointer;
            font-family: inherit;
        }

        .level-btn span {
            display: block;
            font-size: 25px;
        }

        .level-btn strong {
            display: block;
            margin-top: 5px;
        }

        .level-btn small {
            display: block;
            margin-top: 4px;
        }

        .level-btn.active {
            background: #2196f3;
            color: white;
        }

        .level-btn.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-box {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-size: 17px;
        }

        .addition-card {
            background: white;
            border-radius: 25px;
            padding: 30px 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        /*
           العملية من اليسار إلى اليمين
        */

        .operation {
            direction: ltr;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-size: clamp(42px, 10vw, 75px);
            font-weight: bold;
            margin: 25px 0;
        }

        .answer-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #answer {
            width: 220px;
            max-width: 90%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 25px;
            text-align: center;
            font-family: inherit;
        }

        #checkAnswer,
        #nextQuestion,
        #nextLevel {
            border: none;
            border-radius: 12px;
            padding: 13px 22px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        #checkAnswer {
            background: #2196f3;
            color: white;
        }

        #nextQuestion {
            display: none;
            background: #4caf50;
            color: white;
            margin-top: 20px;
        }

        .message {
            min-height: 40px;
            margin-top: 20px;
            font-size: 21px;
            font-weight: bold;
        }

        .correct {
            color: #159447;
        }

        .wrong {
            color: #d93025;
        }

        .complete {
            display: none;
            background: white;
            border-radius: 25px;
            padding: 30px 15px;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .complete-icon {
            font-size: 65px;
        }

        .complete h2 {
            font-size: 30px;
        }

        #nextLevel {
            background: #2196f3;
            color: white;
        }

        .back-button {
            display: block;
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 600px) {

            .levels {
                grid-template-columns: repeat(2, 1fr);
            }

            .level-btn:last-child {
                grid-column: span 2;
            }

            .progress-box {
                flex-direction: column;
                text-align: center;
            }

            .operation {
                gap: 8px;
            }

            #answer {
                width: 90%;
            }

            #checkAnswer {
                width: 90%;
            }
        }

    </style>

</head>


<body>

<header>

    <h1>➕ تعلم الجمع</h1>

    <p>
        تعلم الجمع خطوة بخطوة 🌟
    </p>

</header>


<main class="container addition-page">


    <div class="addition-title">

        <h2>🧮 مغامرة الجمع</h2>

        <p>
            أكمل المستوى لفتح المستوى التالي
        </p>

    </div>


    <!-- المستويات -->

    <div class="levels">

        <button class="level-btn active" data-level="1">

            <span>1️⃣</span>

            <strong>المستوى 1</strong>

            <small>رقم واحد</small>

        </button>


        <button class="level-btn locked" data-level="2">

            <span>🔒</span>

            <strong>المستوى 2</strong>

            <small>رقمان</small>

        </button>


        <button class="level-btn locked" data-level="3">

            <span>🔒</span>

            <strong>المستوى 3</strong>

            <small>3 أرقام</small>

        </button>


        <button class="level-btn locked" data-level="4">

            <span>🔒</span>

            <strong>المستوى 4</strong>

            <small>4 أرقام</small>

        </button>


        <button class="level-btn locked" data-level="5">

            <span>🔒</span>

            <strong>المستوى 5</strong>

            <small>5 أرقام</small>

        </button>

    </div>


    <!-- المعلومات -->

    <div class="progress-box">

        <span>
            المستوى:
            <strong id="levelNumber">1</strong>
        </span>

        <span>
            العملية:
            <strong id="questionNumber">1</strong>
            / 10
        </span>

        <span>
            ⭐ النقاط:
            <strong id="score">0</strong>
        </span>

    </div>


    <!-- العملية -->

    <div id="additionCard" class="addition-card">

        <div class="operation" dir="ltr">

            <span id="numberA">3</span>

            <span>+</span>

            <span id="numberB">4</span>

            <span>=</span>

            <span>?</span>

        </div>


        <div class="answer-box">

            <input
                id="answer"
                type="number"
                inputmode="numeric"
                placeholder="اكتب الناتج"
                autocomplete="off"
            >

            <button id="checkAnswer">

                تحقق ✓

            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <button id="nextQuestion">

            العملية التالية ➜

        </button>

    </div>


    <!-- نهاية المستوى -->

    <div
        id="complete"
        class="complete"
    >

        <div class="complete-icon">
            🎉
        </div>

        <h2>
            أحسنت!
        </h2>

        <p id="completeText"></p>

        <button id="nextLevel">

            الانتقال إلى المستوى التالي ➜

        </button>

    </div>


    <a
        href="math.html"
        class="main-button games back-button"
    >
        ↩️ العودة إلى الرياضيات
    </a>


</main>


<footer>

    <p>
        🌟 تعلم الحساب بالمرح واللعب 🌟
    </p>

</footer>


<script src="addition.js"></script>

</body>

  </html>
