<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>عمليات الجمع</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .addition-page {
            max-width: 800px;
            margin: auto;
            padding: 15px;
        }

        .operation-info {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            background: #f5f5f5;
            padding: 14px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .addition-card {
            background: white;
            border-radius: 25px;
            padding: 30px 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        /*
            العملية من اليسار إلى اليمين
        */

        .operation {
            direction: ltr;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-size: clamp(42px, 11vw, 75px);
            font-weight: bold;
            margin: 30px 0;
        }

        .answer-area {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        #answer {
            width: 220px;
            max-width: 90%;
            padding: 14px;
            font-size: 25px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-family: inherit;
        }

        #checkAnswer,
        #nextQuestion,
        #backToLevels {
            border: none;
            border-radius: 12px;
            padding: 13px 22px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        #checkAnswer {
            background: #2196f3;
            color: white;
        }

        #nextQuestion {
            display: none;
            background: #4caf50;
            color: white;
            margin-top: 20px;
        }

        .message {
            min-height: 40px;
            margin-top: 20px;
            font-size: 21px;
            font-weight: bold;
        }

        .correct {
            color: #159447;
        }

        .wrong {
            color: #d93025;
        }

        .level-finished {
            display: none;
            text-align: center;
            background: white;
            border-radius: 25px;
            padding: 30px 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .level-finished .emoji {
            font-size: 65px;
        }

        .level-finished h2 {
            font-size: 30px;
        }

        #backToLevels {
            background: #2196f3;
            color: white;
            margin-top: 15px;
        }

        @media (max-width: 600px) {

            .operation-info {
                flex-direction: column;
                text-align: center;
            }

            .operation {
                gap: 8px;
            }

            #answer,
            #checkAnswer {
                width: 90%;
            }

        }

    </style>

</head>


<body>

<header>

    <h1>➕ عمليات الجمع</h1>

    <p id="levelTitle">
        المستوى 1
    </p>

</header>


<main class="container addition-page">


    <!-- معلومات المستوى -->

    <div class="operation-info">

        <span>
            🎯 المستوى:
            <strong id="levelNumber">1</strong>
        </span>

        <span>
            📝 العملية:
            <strong id="questionNumber">1</strong>
            / 10
        </span>

        <span>
            ⭐ النقاط:
            <strong id="score">0</strong>
        </span>

    </div>


    <!-- العمليات -->

    <div
        id="additionCard"
        class="addition-card"
    >

        <div
            class="operation"
            dir="ltr"
        >

            <span id="numberA">5</span>

            <span>+</span>

            <span id="numberB">3</span>

            <span>=</span>

            <span>?</span>

        </div>


        <div class="answer-area">

            <input
                id="answer"
                type="number"
                inputmode="numeric"
                placeholder="اكتب الناتج"
                autocomplete="off"
            >

            <button id="checkAnswer">
                تحقق ✓
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <button id="nextQuestion">
            العملية التالية ➜
        </button>

    </div>


    <!-- نجاح المستوى -->

    <div
        id="levelFinished"
        class="level-finished"
    >

        <div class="emoji">
            🎉
        </div>

        <h2>
            أحسنت!
        </h2>

        <p id="finishedText"></p>

        <button id="backToLevels">
            🎯 العودة إلى مستويات الجمع
        </button>

    </div>


</main>


<footer>

    <p>
        🌟 تعلم الحساب بالمرح واللعب 🌟
    </p>

</footer>


<script src="addition.js"></script>

</body>
</html>
