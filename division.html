<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تعلم القسمة</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            color: #111827;
        }

        /* =========================
           الرأس
        ========================= */

        .top {
            background: linear-gradient(
                135deg,
                #4f46e5,
                #06b6d4
            );

            color: white;

            text-align: center;

            padding: 28px 15px 35px;

            border-radius: 0 0 45px 45px;
        }

        .top h1 {
            margin: 0;
            font-size: 30px;
        }

        .level-title {
            margin-top: 8px;
            font-size: 21px;
        }

        .progress {
            margin-top: 12px;
            font-size: 18px;
            font-weight: bold;
        }


        /* =========================
           اللعبة
        ========================= */

        .game {
            width: 100%;
            max-width: 700px;

            margin: 0 auto;

            padding: 25px 12px 40px;
        }

        .question-title {
            text-align: center;

            font-size: 22px;
            font-weight: bold;

            margin-bottom: 20px;
        }


        /* =========================
           لوحة القسمة
        ========================= */

        .division-area {
            width: 100%;

            overflow-x: auto;

            padding:
                10px
                5px
                35px;

            direction: ltr;
        }

        .division-board {

            --cell: 48px;

            position: relative;

            width: max-content;

            min-width: 330px;

            margin: 0 auto;

            direction: ltr;

            font-family:
                Arial,
                sans-serif;

            font-size: 30px;

            font-weight: bold;

            color: #111827;
        }


        /* =========================
           رأس القسمة

           2572 | 3
                ----
                 ...
        ========================= */

        .division-head {

            position: relative;

            height: 110px;
        }


        .dividend {

            position: absolute;

            left: 0;
            top: 0;

            display: flex;

            direction: ltr;
        }

        .dividend-digit {

            width: var(--cell);

            height: 50px;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;
        }


        /* الخط العمودي */

        .vertical-line {

            position: absolute;

            top: 0;

            width: 3px;

            height: 105px;

            background: #111827;
        }


        /* المقسوم عليه */

        .divisor {

            position: absolute;

            top: 2px;

            text-align: center;

            width: 55px;
        }


        /* الخط الأفقي */

        .horizontal-line {

            position: absolute;

            height: 3px;

            background: #111827;
        }


        /* حاصل القسمة */

        .quotient {

            position: absolute;

            top: 2px;

            display: flex;

            direction: ltr;
        }

        .quotient-digit {

            width: var(--cell);

            height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* =========================
           منطقة الخطوات
        ========================= */

        .work-area {

            position: relative;

            min-height: 260px;
        }


        .work-row {

            position: relative;

            height: 43px;

            display: flex;

            direction: ltr;
        }

        .work-cell {

            width: var(--cell);

            height: 43px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* علامة الطرح */

        .minus {

            position: absolute;

            font-size: 27px;

            font-weight: normal;

            left: -28px;

            top: 4px;
        }


        /* خط الطرح */

        .work-line {

            height: 3px;

            background: #111827;

            margin-top: 0;

            margin-bottom: 7px;

            border-radius: 2px;
        }


        /* =========================
           الأسهم
        ========================= */

        .bring-arrow {

            position: absolute;

            width: var(--cell);

            height: 55px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            font-size: 34px;

            font-weight: normal;

            z-index: 20;

            pointer-events: none;

            animation: arrowAppear .35s ease-out;
        }

        @keyframes arrowAppear {

            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           بطاقة الإجابة
        ========================= */

        .answer-card {

            width: 100%;

            max-width: 500px;

            margin: 5px auto 18px;

            background: white;

            border-radius: 25px;

            padding: 24px 18px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.08);

            text-align: center;
        }

        .step-label {

            font-size: 21px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .instruction {

            font-size: 19px;

            color: #4b5563;

            min-height: 34px;

            line-height: 1.6;
        }

        .answer-input {

            width: 105px;

            height: 62px;

            margin: 15px auto 5px;

            display: block;

            text-align: center;

            direction: ltr;

            font-size: 30px;

            font-weight: bold;

            border:
                3px solid
                #10b981;

            border-radius: 16px;

            outline: none;
        }

        .answer-input:focus {

            border-color:
                #2563eb;
        }


        /* =========================
           زر التحقق
        ========================= */

        .check {

            width: min(100%, 500px);

            height: 62px;

            display: block;

            margin: 0 auto;

            border: none;

            border-radius: 20px;

            background: #168cf0;

            color: white;

            font-size: 24px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 7px 18px
                rgba(0,0,0,.15);
        }

        .check:active {

            transform: scale(.98);
        }


        /* =========================
           الرسالة
        ========================= */

        .message {

            min-height: 32px;

            margin: 12px auto;

            text-align: center;

            font-size: 19px;

            font-weight: bold;
        }

        .success {

            color: #059669;
        }

        .error {

            color: #dc2626;
        }


        /* =========================
           شاشة النهاية
        ========================= */

        .finish-card {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,.55);

            z-index: 1000;
        }

        .finish-box {

            width: 100%;

            max-width: 430px;

            background: white;

            border-radius: 25px;

            padding: 30px 20px;

            text-align: center;
        }

        .stars {

            font-size: 38px;

            margin-bottom: 12px;
        }

        .finish-box h2 {

            font-size: 30px;

            margin: 8px 0;
        }


        /* =========================
           الهاتف
        ========================= */

        @media (max-width: 520px) {

            .division-board {

                --cell: 39px;

                font-size: 25px;
            }

            .top h1 {

                font-size: 27px;
            }

            .question-title {

                font-size: 20px;
            }

            .instruction {

                font-size: 17px;
            }

            .check {

                font-size: 22px;
            }
        }

    </style>

</head>


<body>


<header class="top">

    <h1>➗ تعلم القسمة</h1>

    <div class="level-title">
        المستوى
        <span id="levelNumber">1</span>
    </div>

    <div class="progress">
        العملية
        <span id="questionNumber">1</span>
        من 12
    </div>

</header>


<main class="game">

    <div class="question-title">
        حل العملية خطوة بخطوة
    </div>


    <div class="division-area">

        <div
            id="divisionBoard"
            class="division-board"
        ></div>

    </div>


    <div class="answer-card">

        <div
            id="stepLabel"
            class="step-label"
        >
            الخطوة 1
        </div>

        <div
            id="instruction"
            class="instruction"
        ></div>

        <input
            id="answerInput"
            class="answer-input"
            type="number"
            inputmode="numeric"
            autocomplete="off"
        >

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <button
        id="checkButton"
        class="check"
    >
        ✓ تحقق
    </button>

</main>


<div
    id="finishCard"
    class="finish-card"
>

    <div class="finish-box">

        <div class="stars">
            ⭐ 🎉 ⭐
        </div>

        <h2 id="finishTitle">
            أحسنت!
        </h2>

        <p id="finishText"></p>

    </div>

</div>


<script src="division.js"></script>

</body>

</html>
