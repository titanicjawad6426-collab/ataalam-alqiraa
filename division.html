<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تعلم القسمة</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .top {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: white;
            padding: 25px 15px 35px;
            border-radius: 0 0 45px 45px;
            text-align: center;
        }

        .top h1 {
            margin: 0;
            font-size: 30px;
        }

        .top .level-title {
            margin-top: 10px;
            font-size: 21px;
        }

        .progress {
            margin: 15px auto 0;
            max-width: 420px;
            font-size: 18px;
            font-weight: bold;
        }

        .game {
            max-width: 700px;
            margin: 25px auto;
            padding: 0 12px;
        }

        .question-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /*
         * لوحة القسمة
         */
        .division-board-wrapper {
            width: 100%;
            overflow-x: auto;
            padding: 10px 5px 20px;
        }

        .division-board {
            direction: ltr;

            --cell: 48px;

            position: relative;

            width: max-content;
            min-width: 360px;

            margin: auto;

            font-family:
                "Courier New",
                monospace;

            font-size: 30px;
            font-weight: bold;

            text-align: right;
        }

        /*
         * رأس القسمة
         */
        .division-top {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            min-height: 100px;
        }

        .dividend {
            display: flex;
            direction: ltr;
            height: 58px;
        }

        .digit {
            width: var(--cell);
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .division-symbol {
            position: relative;
            width: 58px;
            height: 95px;
            margin-left: 10px;
        }

        .division-symbol::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 95px;
            border-left: 3px solid #111827;
        }

        .division-symbol::after {
            content: "";
            position: absolute;
            left: 0;
            top: 48px;
            width: 100px;
            border-top: 3px solid #111827;
        }

        .divisor {
            position: absolute;
            left: 25px;
            top: 0;
            width: 70px;
            text-align: center;
        }

        .quotient {
            position: absolute;
            left: 80px;
            top: 4px;

            display: flex;
            direction: ltr;
        }

        .quotient .q-digit {
            width: var(--cell);
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*
         * منطقة خطوات الحل
         */
        .steps {
            position: relative;
            margin-top: 5px;
            min-height: 300px;
        }

        .division-step {
            display: grid;
            grid-template-columns: repeat(var(--columns), var(--cell));
            justify-content: start;
            direction: ltr;

            min-height: 48px;

            position: relative;
        }

        .division-step .cell {
            width: var(--cell);
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .minus-sign {
            position: absolute;
            left: -25px;
            top: 5px;
            font-family: Arial, sans-serif;
            font-weight: normal;
        }

        .step-line {
            height: 2px;
            background: #111827;
            margin: 2px 0 7px;
        }

        /*
         * سهم إنزال الرقم
         */
        .bring-arrow {
            position: absolute;

            width: 32px;
            height: 48px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            font-size: 34px;
            font-weight: normal;

            z-index: 5;

            animation: arrowMove .7s ease-in-out;
        }

        @keyframes arrowMove {
            0% {
                opacity: 0;
                transform: translateY(-12px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /*
         * بطاقة السؤال الحالي
         */
        .answer-card {
            margin: 10px auto 18px;
            max-width: 500px;

            background: white;
            border-radius: 22px;
            padding: 20px;

            box-shadow: 0 8px 25px rgba(0,0,0,.08);
        }

        .step-label {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .instruction {
            color: #4b5563;
            font-size: 17px;
            line-height: 1.7;
            min-height: 30px;
        }

        .answer-input {
            width: 90px;
            height: 58px;

            text-align: center;

            font-size: 30px;
            font-weight: bold;

            border: 3px solid #10b981;
            border-radius: 14px;

            outline: none;
            direction: ltr;

            margin: 12px auto;
            display: block;
        }

        .answer-input:focus {
            border-color: #2563eb;
        }

        .check {
            display: block;

            width: min(100%, 500px);
            margin: 0 auto;

            min-height: 62px;

            border: none;
            border-radius: 20px;

            background: #168cf0;
            color: white;

            font-size: 25px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 7px 18px rgba(0,0,0,.15);
        }

        .check:active {
            transform: scale(.98);
        }

        .message {
            text-align: center;
            min-height: 32px;
            margin: 15px auto;

            font-size: 19px;
            font-weight: bold;
        }

        .success {
            color: #059669;
        }

        .error {
            color: #dc2626;
        }

        .finish-card {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,.55);

            align-items: center;
            justify-content: center;

            z-index: 1000;

            padding: 20px;
        }

        .finish-box {
            background: white;
            border-radius: 25px;
            padding: 35px 25px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .finish-box h2 {
            font-size: 30px;
            margin-top: 0;
        }

        .stars {
            font-size: 38px;
            margin: 15px 0;
        }

        @media (max-width: 520px) {

            .division-board {
                --cell: 38px;
                font-size: 25px;
            }

            .digit {
                width: var(--cell);
            }

            .top h1 {
                font-size: 26px;
            }

            .question-title {
                font-size: 18px;
            }

            .answer-card {
                padding: 16px;
            }

            .check {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<header class="top">

    <h1>➗ تعلم القسمة</h1>

    <div class="level-title">
        المستوى <span id="levelNumber">1</span>
    </div>

    <div class="progress">
        العملية <span id="questionNumber">1</span>
        من 12
    </div>

</header>


<main class="game">

    <div class="question-title">
        حل العملية خطوة بخطوة
    </div>


    <div class="division-board-wrapper">

        <div id="divisionBoard" class="division-board">

            <!-- يتم رسم العملية بواسطة JavaScript -->

        </div>

    </div>


    <div class="answer-card">

        <div id="stepLabel" class="step-label">
            الخطوة
        </div>

        <div id="instruction" class="instruction">
            اكتب الإجابة
        </div>

        <input
            id="answerInput"
            class="answer-input"
            type="number"
            inputmode="numeric"
            autocomplete="off"
        >

    </div>


    <div id="message" class="message"></div>


    <button id="checkButton" class="check">
        ✓ تحقق
    </button>

</main>


<div id="finishCard" class="finish-card">

    <div class="finish-box">

        <div class="stars">
            ⭐ 🎉 ⭐
        </div>

        <h2 id="finishTitle">
            أحسنت!
        </h2>

        <p id="finishText"></p>

    </div>

</div>


<script src="division.js"></script>

</body>
</html>
