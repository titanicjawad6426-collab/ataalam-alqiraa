<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>تعلم القسمة</title>

<link rel="stylesheet" href="style.css">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7fb;
    font-family: Arial, sans-serif;
    color: #111827;
}

.top {
    background: linear-gradient(
        135deg,
        #4f46e5,
        #06b6d4
    );

    color: white;
    text-align: center;

    padding: 28px 15px 35px;

    border-radius: 0 0 45px 45px;
}

.top h1 {
    margin: 0;
    font-size: 30px;
}

.level-title {
    margin-top: 8px;
    font-size: 21px;
}

.progress {
    margin-top: 12px;
    font-size: 18px;
    font-weight: bold;
}

.game {
    width: 100%;
    max-width: 700px;

    margin: auto;

    padding: 25px 10px 40px;
}

.question-title {
    text-align: center;

    font-size: 22px;
    font-weight: bold;

    margin-bottom: 20px;
}


/* =================================
   لوحة القسمة
================================= */

.division-scroll {
    width: 100%;

    overflow-x: auto;

    padding: 10px 5px 25px;

    direction: ltr;
}

.division-board {

    --cell: 46px;

    position: relative;

    width: max-content;

    margin: auto;

    direction: ltr;

    font-family: Arial, sans-serif;

    font-size: 29px;

    font-weight: bold;

    min-height: 430px;
}


/* =================================
   المقسوم
================================= */

.dividend-row {
    display: grid;

    align-items: center;

    height: 55px;
}

.dividend-digit {
    width: var(--cell);
    height: 50px;

    display: flex;

    align-items: center;
    justify-content: center;

    position: relative;
}


/* =================================
   الخط العمودي
================================= */

.vertical-line {
    position: absolute;

    width: 3px;

    background: #111827;

    top: 0;

    bottom: 0;

    z-index: 1;
}


/* =================================
   المقسوم عليه
================================= */

.divisor {
    position: absolute;

    font-size: 29px;

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 5;
}


/* =================================
   الخط الأفقي
================================= */

.horizontal-line {
    position: absolute;

    height: 3px;

    background: #111827;

    z-index: 2;
}


/* =================================
   حاصل القسمة
================================= */

.quotient-row {
    position: absolute;

    display: grid;

    height: 58px;

    z-index: 10;
}

.quotient-cell {
    width: var(--cell);

    height: 55px;

    display: flex;

    align-items: center;
    justify-content: center;
}


/* =================================
   خانات الأرقام
================================= */

.digit-input {

    width: 38px;
    height: 44px;

    border: 3px solid #10b981;

    border-radius: 10px;

    background: white;

    text-align: center;

    direction: ltr;

    font-size: 27px;

    font-weight: bold;

    outline: none;

    padding: 0;
}

.digit-input:focus {

    border-color: #2563eb;

    box-shadow:
        0 0 0 4px
        rgba(37,99,235,.12);
}

.digit-input.locked {

    border-color: transparent;

    background: transparent;

    box-shadow: none;

    pointer-events: none;
}


/* =================================
   صفوف خطوات القسمة
================================= */

.work-area {
    position: absolute;

    left: 0;

    top: 125px;

    width: 100%;
}

.work-row {

    display: grid;

    align-items: center;

    min-height: 48px;

    position: relative;
}


/* =================================
   خلايا العمل
================================= */

.work-cell {

    width: var(--cell);

    min-height: 45px;

    display: flex;

    align-items: center;
    justify-content: center;

    position: relative;
}


/* =================================
   علامة الطرح
================================= */

.minus-sign {

    position: absolute;

    left: -27px;

    font-size: 28px;

    font-weight: normal;
}


/* =================================
   خط الطرح
================================= */

.subtraction-line {

    height: 3px;

    background: #111827;

    margin-top: 1px;

    margin-bottom: 6px;
}


/* =================================
   الأسهم
================================= */

.down-arrow {

    position: absolute;

    width: var(--cell);

    height: 45px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 34px;

    font-weight: normal;

    z-index: 20;

    animation: arrowIn .3s ease;
}

@keyframes arrowIn {

    from {
        opacity: 0;
        transform: translateY(-8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =================================
   نقطة للخانات الفارغة
================================= */

.empty-dot {

    color: #9ca3af;

    font-size: 24px;
}


/* =================================
   معلومات الخطوة
================================= */

.step-info {

    text-align: center;

    min-height: 70px;

    margin-top: 5px;
}

.step-title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 7px;
}

.step-help {

    font-size: 18px;

    color: #4b5563;
}


/* =================================
   الرسالة
================================= */

.message {

    min-height: 32px;

    text-align: center;

    font-size: 19px;

    font-weight: bold;

    margin: 8px 0;
}

.success {
    color: #059669;
}

.error {
    color: #dc2626;
}


/* =================================
   زر التحقق
================================= */

.check-button {

    display: block;

    width: min(100%, 500px);

    height: 62px;

    margin: 8px auto 0;

    border: none;

    border-radius: 20px;

    background: #168cf0;

    color: white;

    font-size: 24px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(0,0,0,.15);
}

.check-button:active {
    transform: scale(.98);
}


/* =================================
   شاشة النهاية
================================= */

.finish {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.55);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 1000;

    padding: 20px;
}

.finish-box {

    width: 100%;

    max-width: 430px;

    background: white;

    border-radius: 25px;

    padding: 30px 20px;

    text-align: center;
}

.finish-stars {

    font-size: 38px;
}

.finish-box h2 {

    font-size: 29px;

    margin: 10px 0;
}


/* =================================
   الهاتف
================================= */

@media (max-width: 520px) {

    .division-board {
        --cell: 39px;

        font-size: 25px;
    }

    .digit-input {

        width: 33px;
        height: 39px;

        font-size: 24px;
    }

    .top h1 {
        font-size: 27px;
    }

    .question-title {
        font-size: 20px;
    }

    .step-help {
        font-size: 16px;
    }

    .check-button {
        font-size: 22px;
    }
}

</style>

</head>

<body>


<header class="top">

    <h1>➗ تعلم القسمة</h1>

    <div class="level-title">
        المستوى
        <span id="levelNumber">1</span>
    </div>

    <div class="progress">
        العملية
        <span id="questionNumber">1</span>
        من 12
    </div>

</header>


<main class="game">

    <div class="question-title">
        حل العملية خطوة بخطوة
    </div>


    <div class="division-scroll">

        <div
            id="divisionBoard"
            class="division-board"
        ></div>

    </div>


    <div class="step-info">

        <div
            id="stepTitle"
            class="step-title"
        ></div>

        <div
            id="stepHelp"
            class="step-help"
        ></div>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <button
        id="checkButton"
        class="check-button"
    >
        ✓ تحقق
    </button>

</main>


<div
    id="finish"
    class="finish"
>

    <div class="finish-box">

        <div class="finish-stars">
            ⭐ 🎉 ⭐
        </div>

        <h2 id="finishTitle">
            أحسنت!
        </h2>

        <p id="finishText"></p>

    </div>

</div>


<script src="division.js"></script>

</body>

</html>
