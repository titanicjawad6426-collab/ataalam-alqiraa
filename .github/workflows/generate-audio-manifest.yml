name: Generate Audio Manifest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate audio-manifest.json
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          audio_dir = Path("audio")
          files = []

          if audio_dir.exists():
              for file in sorted(audio_dir.rglob("*")):
                  if file.is_file() and file.suffix.lower() == ".mp3":
                      files.append(file.as_posix())

          Path("audio-manifest.json").write_text(
              json.dumps(files, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Found {len(files)} audio files.")
          PY

      - name: Save manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add audio-manifest.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update audio manifest [skip ci]"
            git push
          fi
