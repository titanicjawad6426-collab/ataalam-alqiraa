<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعلم القراءة العربية</title>
<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f1f7ff;
    font-family:Arial,sans-serif;
    text-align:center;
}

header{
    background:linear-gradient(135deg,#2196f3,#673ab7);
    color:white;
    padding:22px 10px;
}

.container{
    width:95%;
    max-width:750px;
    margin:20px auto;
}

.box{
    background:white;
    padding:20px 12px;
    border-radius:18px;
    margin:15px 0;
    box-shadow:0 3px 10px #ddd;
}

.levels{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.level{
    background:#e3f2fd;
    border:2px solid #90caf9;
    border-radius:14px;
    padding:15px 5px;
    cursor:pointer;
    font-size:17px;
}

.level.locked{
    background:#eee;
    border-color:#ccc;
    color:#888;
    cursor:not-allowed;
}

.level.active{
    background:#c8e6c9;
    border-color:#4caf50;
}

.level strong{
    display:block;
    font-size:22px;
    margin-bottom:7px;
}

#lesson{
    display:none;
}

.word{
    font-size:52px;
    font-weight:bold;
    color:#1565c0;
    margin:30px 0;
    min-height:75px;
    direction:rtl;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    margin:6px;
    font-size:17px;
    cursor:pointer;
}

.listen{
    background:#2196f3;
    color:white;
}

.mic{
    background:#4caf50;
    color:white;
}

.back{
    background:#607d8b;
    color:white;
}

.next{
    background:#ff9800;
    color:white;
}

#feedback{
    min-height:40px;
    font-size:20px;
    font-weight:bold;
    margin:15px 0;
}

.progress{
    background:#eee;
    height:13px;
    border-radius:20px;
    overflow:hidden;
    margin:15px 0;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#4caf50;
    transition:.3s;
}

.info{
    color:#555;
    font-size:15px;
}

#result{
    display:none;
}

.result-number{
    font-size:32px;
    color:#2196f3;
    font-weight:bold;
}

#heard{
    color:#555;
    font-size:17px;
    min-height:25px;
}

@media(max-width:400px){
    .word{font-size:43px}
    button{font-size:15px;padding:12px}
}
</style>
</head>

<body>

<header>
    <h1>📖 تعلم القراءة العربية</h1>
    <p>تعلم الحروف والمقاطع والكلمات والجمل</p>
</header>

<main class="container">

    <section id="menu" class="box">

        <h2>🌟 اختر مستوى القراءة</h2>

        <p class="info">
            أكمل تدريبات كل مستوى لفتح المستوى التالي.
        </p>

        <div id="levels" class="levels"></div>

        <p id="saved-progress" class="info"></p>

        <a href="arabic.html" class="back-button">
            ↩️ العودة إلى العربية
        </a>

    </section>

    <section id="lesson" class="box">

        <h2 id="level-title"></h2>

        <p id="level-description" class="info"></p>

        <div class="progress">
            <div id="progress-fill" class="progress-fill"></div>
        </div>

        <p>
            السؤال <span id="question-number">1</span>
            من 10
        </p>

        <div id="word" class="word"></div>

        <button class="listen" onclick="speakWord()">
            🔊 استمع إلى النطق
        </button>

        <br>

        <button class="mic" id="mic-button" onclick="startListening()">
            🎤 اقرأ بنفسك
        </button>

        <p id="feedback"></p>

        <p id="heard"></p>

        <button class="next" id="next-button"
                onclick="nextQuestion()" style="display:none">
            السؤال التالي ➡️
        </button>

        <br>

        <button class="back" onclick="backToLevels()">
            ↩️ العودة إلى المستويات
        </button>

        <p class="info">
            يمكنك الاستماع إلى الكلمة قبل قراءتها.
        </p>

    </section>

    <section id="result" class="box">

        <h2>🎉 انتهى التدريب!</h2>

        <div class="result-number" id="result-score"></div>

        <p id="result-message"></p>

        <button class="next" onclick="repeatLevel()">
            🔄 تدريب جديد بكلمات مختلفة
        </button>

        <button class="listen" onclick="backToLevels()">
            📚 العودة إلى المستويات
        </button>

    </section>

</main>

/* =================================
   متغيرات البرنامج
================================= */

const PROGRESS_KEY="arabicReadingProgressV1";

let unlockedLevel=1;
let currentLevel=1;
let currentWords=[];
let currentIndex=0;
let score=0;
let isListening=false;
let recognition=null;
let questionFinished=false;


/* =================================
   حفظ التقدم
================================= */

function loadProgress(){

try{
unlockedLevel=Number(localStorage.getItem(PROGRESS_KEY))||1;
}catch(e){
unlockedLevel=1;
}

unlockedLevel=Math.max(1,Math.min(8,unlockedLevel));

}

function saveProgress(){

try{
localStorage.setItem(PROGRESS_KEY,unlockedLevel);
}catch(e){}

}


/* =================================
   عرض المستويات
================================= */

function showLevels(){

document.getElementById("menu").style.display="block";
document.getElementById("lesson").style.display="none";
document.getElementById("result").style.display="none";

const box=document.getElementById("levels");
box.innerHTML="";

levelsData.forEach((level,index)=>{

const number=index+1;
const locked=number>unlockedLevel;

const button=document.createElement("button");

button.className="level";

if(locked)button.classList.add("locked");
if(number===unlockedLevel)button.classList.add("active");

button.innerHTML=
`<strong>${locked?"🔒": "📖"} المستوى ${number}</strong>
${level.title.split(":")[1]}`;

button.disabled=locked;

button.onclick=()=>startLevel(number);

box.appendChild(button);

});

document.getElementById("saved-progress").textContent=
"المستوى المفتوح حالياً: "+unlockedLevel+" من 8";

}


/* =================================
   اختيار كلمات عشوائية
================================= */

function shuffle(array){

const copy=[...array];

for(let i=copy.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[copy[i],copy[j]]=[copy[j],copy[i]];

}

return copy;

}

function startLevel(number){

if(number>unlockedLevel)return;

currentLevel=number;

const bank=levelsData[number-1].words;

currentWords=shuffle(bank).slice(0,10);

currentIndex=0;
score=0;

document.getElementById("menu").style.display="none";
document.getElementById("lesson").style.display="block";
document.getElementById("result").style.display="none";

document.getElementById("level-title").textContent=
levelsData[number-1].title;

document.getElementById("level-description").textContent=
levelsData[number-1].description;

showQuestion();

}


/* =================================
   عرض السؤال
================================= */

function showQuestion(){

questionFinished=false;

const word=currentWords[currentIndex];

document.getElementById("word").textContent=word;

document.getElementById("question-number").textContent=
currentIndex+1;

document.getElementById("progress-fill").style.width=
(currentIndex/10*100)+"%";

document.getElementById("feedback").textContent="";
document.getElementById("heard").textContent="";

document.getElementById("next-button").style.display="none";

const mic=document.getElementById("mic-button");
mic.disabled=false;
mic.textContent="🎤 اقرأ بنفسك";

}


/* =================================
   النطق الآلي
================================= */

function speakWord(){

if(!("speechSynthesis" in window)){
alert("النطق الآلي غير مدعوم في هذا المتصفح.");
return;
}

speechSynthesis.cancel();

const speech=new SpeechSynthesisUtterance(
currentWords[currentIndex]
);

speech.lang="ar-SA";
speech.rate=0.65;
speech.pitch=1;

speechSynthesis.speak(speech);

}


/* =================================
   التعرف على صوت الطفل
================================= */

function normalizeArabic(text){

return text
.normalize("NFD")
.replace(/[\u064B-\u065F\u0670\u0640]/g,"")
.replace(/[أإآٱ]/g,"ا")
.replace(/ى/g,"ي")
.replace(/[.,،!?؟]/g,"")
.replace(/\s+/g,"")
.trim();

}

function startListening(){

if(questionFinished)return;

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert(
"التعرف على الصوت غير متوفر في هذا المتصفح. جرب Google Chrome مع اتصال بالإنترنت."
);

return;

}

if(isListening)return;

recognition=new SpeechRecognition();

recognition.lang="ar-SA";
recognition.continuous=false;
recognition.interimResults=false;
recognition.maxAlternatives=3;

isListening=true;

const mic=document.getElementById("mic-button");

mic.disabled=true;
mic.textContent="🎙️ أستمع إليك...";

document.getElementById("feedback").textContent=
"تفضل، اقرأ الكلمة بصوت واضح.";

recognition.onresult=function(event){

const alternatives=[];

for(let i=0;i<event.results[0].length;i++){
alternatives.push(event.results[0][i].transcript);
}

checkPronunciation(alternatives);

};

recognition.onerror=function(event){

isListening=false;
mic.disabled=false;
mic.textContent="🎤 حاول القراءة مجدداً";

document.getElementById("feedback").textContent=
event.error==="not-allowed"?
"يرجى السماح باستخدام الميكروفون.":
"لم أتمكن من سماعك. حاول مرة أخرى.";

};

recognition.onend=function(){

isListening=false;

if(!questionFinished){
mic.disabled=false;
mic.textContent="🎤 اقرأ بنفسك";
}

};

try{
recognition.start();
}catch(e){
isListening=false;
mic.disabled=false;
mic.textContent="🎤 اقرأ بنفسك";
}

}


/* =================================
   تقييم القراءة
================================= */

function checkPronunciation(alternatives){

const target=normalizeArabic(
currentWords[currentIndex]
);

let correct=false;

for(const spoken of alternatives){

const normalized=normalizeArabic(spoken);

if(normalized===target){
correct=true;
break;
}

}

const feedback=document.getElementById("feedback");

document.getElementById("heard").textContent=
"سمعت: "+alternatives.join(" / ");

if(correct){

score++;

questionFinished=true;

feedback.textContent="🌟 أحسنت! قراءة صحيحة";

feedback.style.color="green";

document.getElementById("next-button").style.display="inline-block";

document.getElementById("mic-button").disabled=true;

}else{

feedback.textContent="❌ لم نتعرف على الكلمة بشكل صحيح. استمع وحاول مجدداً.";

feedback.style.color="#d32f2f";

document.getElementById("mic-button").disabled=false;
document.getElementById("mic-button").textContent="🎤 حاول مرة أخرى";

}

}


/* =================================
   السؤال التالي
================================= */

function nextQuestion(){

if(!questionFinished)return;

currentIndex++;

if(currentIndex>=10){

showResult();

}else{

showQuestion();

}

}


/* =================================
   النتيجة وفتح المستوى التالي
================================= */

function showResult(){

document.getElementById("lesson").style.display="none";
document.getElementById("result").style.display="block";

document.getElementById("progress-fill").style.width="100%";

document.getElementById("result-score").textContent=
score+" / 10";

let message="";

if(score===10){

message="🏆 ممتاز! لقد أتقنت المستوى.";

if(currentLevel<8){

unlockedLevel=Math.max(unlockedLevel,currentLevel+1);
saveProgress();

message+=" تم فتح المستوى التالي 🎉";

}else{

message+=" لقد أكملت جميع مستويات القراءة!";

}

}else if(score>=7){

message="👏 جيد جداً! يمكنك إعادة التدريب لتحسين نتيجتك.";

}else{

message="💪 حاول مرة أخرى، ستنجح بالتدريب.";

}

document.getElementById("result-message").textContent=message;

}

function repeatLevel(){

startLevel(currentLevel);

}

function backToLevels(){

if(isListening && recognition){
try{recognition.stop();}catch(e){}
}

if("speechSynthesis" in window){
speechSynthesis.cancel();
}

isListening=false;

showLevels();

}


/* =================================
   تشغيل البرنامج
================================= */

loadProgress();
showLevels();

</script>

</body>
</html>
