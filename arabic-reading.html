<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعلم القراءة</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📖 تعلم القراءة</h1>
    <p>اقرأ الكلمات والجمل واستمع إليها</p>
</header>

<main class="container">

    <div class="content-box">

        <h2>📚 كلمات</h2>

        <p style="font-size: 30px;">أَسَد 🦁</p>

        <button class="open-button" onclick="speak('أسد')">
            🔊 استمع
        </button>

        <hr style="margin: 25px 0;">

        <p style="font-size: 30px;">بَيْت 🏠</p>

        <button class="open-button" onclick="speak('بيت')">
            🔊 استمع
        </button>

    </div>

    <div class="content-box">

        <h2>📖 جملة قصيرة</h2>

        <p style="font-size: 26px;">
            هَذَا بَيْتٌ جَمِيلٌ.
        </p>

        <button class="open-button" onclick="speak('هذا بيت جميل')">
            🔊 استمع إلى الجملة
        </button>

    </div>

    <a href="arabic.html" class="back-button">
        ↩️ العودة إلى العربية
    </a>

</main>

<script>
function speak(text) {

    if ("speechSynthesis" in window) {

        speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(text);

        speech.lang = "ar-SA";
        speech.rate = 0.7;

        speechSynthesis.speak(speech);
    }
}
</script>

</body>
</html>
