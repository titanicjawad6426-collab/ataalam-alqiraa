<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حروف الهجاء العربية</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🔤 حروف الهجاء العربية</h1>
    <p>اضغط على الحرف لسماع نطقه</p>
</header>

<main class="container">

    <div class="content-box">

        <h2>الحروف العربية</h2>

        <div class="letter-grid">

            <button class="letter" onclick="playLetter('أ','ألف')">أ</button>
            <button class="letter" onclick="playLetter('ب','باء')">ب</button>
            <button class="letter" onclick="playLetter('ت','تاء')">ت</button>
            <button class="letter" onclick="playLetter('ث','ثاء')">ث</button>
            <button class="letter" onclick="playLetter('ج','جيم')">ج</button>
            <button class="letter" onclick="playLetter('ح','حاء')">ح</button>
            <button class="letter" onclick="playLetter('خ','خاء')">خ</button>
            <button class="letter" onclick="playLetter('د','دال')">د</button>
            <button class="letter" onclick="playLetter('ذ','ذال')">ذ</button>
            <button class="letter" onclick="playLetter('ر','راء')">ر</button>
            <button class="letter" onclick="playLetter('ز','زاي')">ز</button>
            <button class="letter" onclick="playLetter('س','سين')">س</button>
            <button class="letter" onclick="playLetter('ش','شين')">ش</button>
            <button class="letter" onclick="playLetter('ص','صاد')">ص</button>
            <button class="letter" onclick="playLetter('ض','ضاد')">ض</button>
            <button class="letter" onclick="playLetter('ط','طاء')">ط</button>
            <button class="letter" onclick="playLetter('ظ','ظاء')">ظ</button>
            <button class="letter" onclick="playLetter('ع','عين')">ع</button>
            <button class="letter" onclick="playLetter('غ','غين')">غ</button>
            <button class="letter" onclick="playLetter('ف','فاء')">ف</button>
            <button class="letter" onclick="playLetter('ق','قاف')">ق</button>
            <button class="letter" onclick="playLetter('ك','كاف')">ك</button>
            <button class="letter" onclick="playLetter('ل','لام')">ل</button>
            <button class="letter" onclick="playLetter('م','ميم')">م</button>
            <button class="letter" onclick="playLetter('ن','نون')">ن</button>
            <button class="letter" onclick="playLetter('ه','هاء')">ه</button>
            <button class="letter" onclick="playLetter('و','واو')">و</button>
            <button class="letter" onclick="playLetter('ي','ياء')">ي</button>

        </div>

    </div>


    <div class="content-box">

        <h2 id="selected-letter">👆 اختر حرفًا</h2>

        <p id="status">
            اضغط على حرف لسماع صوته.
        </p>

    </div>


    <a href="arabic.html" class="back-button">
        ↩️ العودة إلى العربية
    </a>

</main>


<script>

let currentAudio = null;


/*
   تشغيل الصوت الخاص بالحرف
*/
function playLetter(letter, audioName) {

    const selectedLetter =
        document.getElementById("selected-letter");

    const status =
        document.getElementById("status");


    selectedLetter.textContent =
        "🔊 " + letter;


    /*
       إيقاف الصوت السابق
       إذا كان هناك صوت يعمل
    */
    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime = 0;

    }


    /*
       إنشاء ملف الصوت
       
       الملفات موجودة داخل:
       audio/
    */
    const audio =
        new Audio(
            "audio/" +
            encodeURIComponent(audioName) +
            ".mp3"
        );


    currentAudio = audio;


    /*
       عند بداية التشغيل
    */
    audio.onplay = function () {

        status.textContent =
            "🔊 يتم تشغيل صوت الحرف...";

    };


    /*
       عند انتهاء الصوت
    */
    audio.onended = function () {

        status.textContent =
            "✅ انتهى الصوت";

    };


    /*
       في حالة حدوث خطأ
    */
    audio.onerror = function () {

        status.textContent =
            "⚠️ تعذر تشغيل ملف الصوت.";

        console.error(
            "لم يتم العثور على ملف:",
            "audio/" + audioName + ".mp3"
        );

    };


    /*
       تشغيل الصوت
    */
    audio.play().catch(function(error) {

        console.error(error);

        status.textContent =
            "⚠️ اضغط على الحرف مرة أخرى لتشغيل الصوت.";

    });

}

</script>

</body>
</html>
