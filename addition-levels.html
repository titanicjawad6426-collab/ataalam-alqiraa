<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>مستويات الجمع</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .levels-page {
            max-width: 850px;
            margin: auto;
            padding: 20px;
        }

        .levels-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .levels-title h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .levels-title p {
            color: #666;
        }

        .levels-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
        }

        .level-card {
            border: 2px solid #ddd;
            background: white;
            border-radius: 18px;
            min-height: 125px;
            padding: 12px 5px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }

        .level-card:hover {
            transform: translateY(-3px);
        }

        .level-card .icon {
            display: block;
            font-size: 32px;
            margin-bottom: 7px;
        }

        .level-card .number {
            display: block;
            font-size: 18px;
            font-weight: bold;
        }

        .level-card .description {
            display: block;
            font-size: 13px;
            color: #777;
            margin-top: 7px;
        }

        /* المستوى المفتوح */

        .level-card.unlocked {
            border-color: #2196f3;
            background: #eef8ff;
        }

        /* آخر مستوى مفتوح */

        .level-card.current {
            border-color: #4caf50;
            background: #effaf0;
        }

        /* المستوى المقفل */

        .level-card.locked {
            opacity: 0.45;
            cursor: not-allowed;
            background: #eeeeee;
            border-color: #cccccc;

            pointer-events: none;

            transform: none !important;

            filter: grayscale(100%);
        }

        .levels-message {
            text-align: center;
            margin-top: 20px;
            min-height: 30px;
            font-weight: bold;
            color: #d93025;
        }

        .reset-progress {
            display: block;
            margin: 25px auto 0;
            border: none;
            background: #eeeeee;
            border-radius: 12px;
            padding: 10px 18px;
            font-family: inherit;
            cursor: pointer;
        }

        @media (max-width: 700px) {

            .levels-page {
                padding: 12px;
            }

            .levels-list {
                grid-template-columns: repeat(2, 1fr);
            }

        }

    </style>

</head>

<body>

<header>

    <h1>➕ تعلم الجمع</h1>

    <p>
        أكمل كل مستوى لفتح المستوى التالي 🌟
    </p>

</header>


<main class="container levels-page">

    <div class="levels-title">

        <h2>🎯 مستويات الجمع</h2>

        <p>
            يجب الحصول على 12 إجابة صحيحة لفتح المستوى التالي
        </p>

    </div>


    <div
        id="levelsList"
        class="levels-list"
    ></div>


    <div
        id="levelsMessage"
        class="levels-message"
    ></div>


    <button
        id="resetProgress"
        class="reset-progress"
    >
        🔄 إعادة التقدم من البداية
    </button>


    <a
        href="math.html"
        class="main-button games"
        style="
            display:block;
            text-align:center;
            margin-top:15px;
        "
    >
        ↩️ العودة إلى الرياضيات
    </a>

</main>


<footer>

    <p>
        🌟 تعلم الحساب بالمرح واللعب 🌟
    </p>

</footer>


<script>

const levelsList =
    document.getElementById(
        "levelsList"
    );

const levelsMessage =
    document.getElementById(
        "levelsMessage"
    );

const resetProgress =
    document.getElementById(
        "resetProgress"
    );


/*
 * مفتاح جديد حتى يبدأ النظام
 * الجديد من المستوى الأول
 */

const PROGRESS_KEY =
    "additionUnlockedLevelV2";


function getUnlockedLevel() {

    let level =
        parseInt(
            localStorage.getItem(
                PROGRESS_KEY
            )
        );


    if (
        isNaN(level) ||
        level < 1
    ) {

        level = 1;

        localStorage.setItem(
            PROGRESS_KEY,
            "1"
        );

    }


    if (level > 10) {
        level = 10;
    }


    return level;

}


function getDescription(level) {

    const descriptions = {

        1: "رقم + رقم",

        2: "رقمان + رقم",

        3: "رقمان + رقمان",

        4: "3 أرقام + رقمان",

        5: "3 أرقام + 3 أرقام",

        6: "4 أرقام + 3 أرقام",

        7: "4 أرقام + 4 أرقام",

        8: "5 أرقام + 4 أرقام",

        9: "5 أرقام + 5 أرقام",

        10: "6 أرقام + 5 أرقام"

    };

    return descriptions[level];

}


function displayLevels() {

    const unlocked =
        getUnlockedLevel();


    levelsList.innerHTML = "";


    for (
        let level = 1;
        level <= 10;
        level++
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "level-card";


        if (level <= unlocked) {

            button.classList.add(
                "unlocked"
            );


            if (
                level === unlocked
            ) {

                button.classList.add(
                    "current"
                );

            }

        } else {

            button.classList.add(
                "locked"
            );

            button.disabled = true;

            button.setAttribute(
                "aria-disabled",
                "true"
            );

        }


        const icon =
            level <= unlocked
                ? "🔓"
                : "🔒";


        button.innerHTML = `

            <span class="icon">
                ${icon}
            </span>

            <span class="number">
                المستوى ${level}
            </span>

            <span class="description">
                ${getDescription(level)}
            </span>

        `;


        if (level <= unlocked) {

            button.addEventListener(
                "click",
                function () {

                    window.location.href =
                        "addition.html?level=" +
                        level;

                }
            );

        }


        levelsList.appendChild(
            button
        );

    }

}


resetProgress.addEventListener(
    "click",
    function () {

        const confirmed =
            confirm(
                "هل تريد إعادة جميع مستويات الجمع إلى البداية؟"
            );


        if (confirmed) {

            localStorage.setItem(
                PROGRESS_KEY,
                "1"
            );


            displayLevels();


            levelsMessage.textContent =
                "🔄 تم فتح المستوى الأول فقط.";

        }

    }
);


displayLevels();

</script>

</body>
</html>
